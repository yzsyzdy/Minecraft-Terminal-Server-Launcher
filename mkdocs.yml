# MSTL Wiki — MkDocs Material 配置
#
# 注意：本文件必须位于仓库根目录。docs_dir 默认相对配置文件所在目录解析，
# 若把它放回 docs/ 下，MkDocs 会去找 docs/docs/。
site_name: MSTL
site_description: Minecraft Terminal Server Launcher — 轻量级、零依赖的 Minecraft 服务端管理器
site_url: https://yzsyzdy.github.io/Minecraft-Terminal-Server-Launcher/
repo_url: https://github.com/yzsyzdy/Minecraft-Terminal-Server-Launcher
repo_name: yzsyzdy/Minecraft-Terminal-Server-Launcher
edit_uri: edit/main/docs

docs_dir: docs

copyright: Copyright &copy; 2026 yzsyzdy — GNU General Public License v3.0

theme:
  name: material
  language: zh
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    # 注意：不要开启 navigation.instant，它与 mkdocs-static-i18n 的语言切换器不兼容
  # primary / accent 都是 custom：配色完全由 stylesheets/extra.css 接管，
  # 这样浅色是「纸」、暗色是「舞台」，和宣传片用同一套色板。
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到亮色模式

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yzsyzdy/Minecraft-Terminal-Server-Launcher
  consent:
    title: Cookie 声明
    description: >-
      本站使用 Cookies 记录您的偏好和访问数据。点击"接受"继续使用。
  analytics:
    provider: google
    property: !ENV [GA_ID, ""]
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: folder
      # 未翻译的页面回落到默认语言（zh），英文可以后补而不影响构建
      fallback_to_default: true
      # 接管 Material 自带的语言选择器
      reconfigure_material: true
      languages:
        - locale: zh
          name: 中文
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_description: Minecraft Terminal Server Launcher — a lightweight, zero-dependency Minecraft server manager
          nav_translations:
            首页: Home
            使用指南: Guide
            快速开始: Quick start
            服务器管理: Server management
            配置说明: Configuration
            功能详解: Features
            插件管理: Plugin management
            模组管理: Mod management
            内网穿透: Tunneling
            网页面板: Web panel
            进阶: Advanced
            项目架构: Architecture
            从源码构建: Building from source
            代码审计报告: Code review
            常见问题: FAQ
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      # 仓库里存在重命名过的路径时，git follow 会给出顺序错乱的日期
      enable_git_follow: false
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 使用指南:
    - guide/index.md
    - 快速开始: guide/quickstart.md
    - 服务器管理: guide/server-management.md
    - 配置说明: guide/configuration.md
  - 功能详解:
    - features/index.md
    - 插件管理: features/plugin-management.md
    - 模组管理: features/mod-management.md
    - 内网穿透: features/tunnel.md
    - 网页面板: features/web-panel.md
  - 进阶:
    - advanced/index.md
    - 项目架构: advanced/architecture.md
    - 从源码构建: advanced/build.md
    - 代码审计报告: advanced/code-review.md
  - 常见问题: faq.md
