name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install nuitka imageio

      # 发版前先跑测试：测试只用标准库，不需要额外装东西。
      # 单独的 tests.yml 会在每次 push/PR 上跑，这里再拦一道，
      # 免得带着失败的测试发出去。
      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build with Nuitka
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Building MSTL v$version (standalone)"

          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=anti-bloat `
            --windows-console-mode=force `
            --windows-icon-from-ico=icon.png `
            --output-dir=build\MSTL `
            --product-name=MSTL `
            --file-description="Minecraft Terminal Server Launcher" `
            --product-version=$version `
            --file-version=$version `
            --copyright="MSTL" `
            --include-data-dir=locales=locales `
            --include-data-dir=webui=webui `
            --output-filename=MSTL.exe `
            start.py

      - name: Verify bundled assets
        shell: powershell
        run: |
          # 运行时要读的资源必须真的在 dist 里：漏一个，打包版的对应功能就是坏的
          # （webui 曾经就漏过，结果面板一打开就是 index.html missing）
          $dist = "build\MSTL\start.dist"
          $required = @(
            "webui\index.html",
            "locales\zh.json",
            "locales\en.json",
            "locales\ru.json",
            "locales\neko.json"
          )
          $missing = @()
          foreach ($rel in $required) {
            $p = Join-Path $dist $rel
            if (Test-Path $p) {
              Write-Host "  ok   $rel"
            } else {
              Write-Host "  MISSING $rel"
              $missing += $rel
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "打包产物缺少运行所需资源: $($missing -join ', ')"
            exit 1
          }

      - name: List build output
        run: Get-ChildItem -Path build\MSTL\start.dist | Select-Object FullName, Length

      - name: Compress build output
        shell: powershell
        run: |
          $source = "build\MSTL\start.dist"
          if (-not (Test-Path $source)) {
            Write-Host "Build output not found at $source"
            exit 1
          }

          # 写入版本信息文件（standalone 模式下 version.json 直接放在 exe 旁）
          $versionFile = Join-Path $source "version.json"
          $json = @{
            version = "${{ github.ref_name }}" -replace '^v', ''
            tag_name = "${{ github.ref_name }}"
          } | ConvertTo-Json
          # 必须写成不带 BOM 的 UTF-8。Windows PowerShell 5.1 的
          # `Set-Content -Encoding UTF8` 会加上 BOM，而 Python 侧 json.load
          # 会因此抛 JSONDecodeError——更新检查就此变成哑的，界面上只是永远
          # 显示「已是最新版」，一点报错都没有。下面那条断言就是防它回来。
          [IO.File]::WriteAllText($versionFile, $json, (New-Object Text.UTF8Encoding $false))
          Write-Host "Created $versionFile"

          $bytes = [IO.File]::ReadAllBytes($versionFile)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and
              $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "version.json 带了 UTF-8 BOM，Python 侧读不出来"
            exit 1
          }
          if (([Text.Encoding]::UTF8.GetString($bytes)) -notmatch '"version"') {
            Write-Error "version.json 内容里没有 version 字段"
            exit 1
          }
          Write-Host "version.json 无 BOM，内容已校验"

          $zipFile = "MSTL-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $zipFile -Force
          Write-Host "Created $zipFile"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSTL-${{ github.ref_name }}
          path: MSTL-${{ github.ref_name }}.zip

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: MSTL-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
