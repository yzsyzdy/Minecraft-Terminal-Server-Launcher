name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install nuitka imageio

      # 发版前先跑测试：测试只用标准库，不需要额外装东西。
      # 单独的 tests.yml 会在每次 push/PR 上跑，这里再拦一道，
      # 免得带着失败的测试发出去。
      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build with Nuitka
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Building MSTL v$version (standalone)"

          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=anti-bloat `
            --windows-console-mode=force `
            --windows-icon-from-ico=icon.png `
            --output-dir=build\MSTL `
            --product-name=MSTL `
            --file-description="Minecraft Terminal Server Launcher" `
            --product-version=$version `
            --file-version=$version `
            --copyright="MSTL" `
            --include-data-dir=locales=locales `
            --include-data-dir=webui=webui `
            --output-filename=MSTL.exe `
            start.py

      - name: Verify bundled assets
        shell: powershell
        run: |
          # 运行时要读的资源必须真的在 dist 里：漏一个，打包版的对应功能就是坏的
          # （webui 曾经就漏过，结果面板一打开就是 index.html missing）
          #
          # 不硬编码 start.dist：Nuitka 的输出目录名随版本会变，直接找 build 下最新的 *.dist。
          # 注意：下面给 ::error::/::warning:: 的文案一律用纯 ASCII——这个步骤是
          # shell: powershell（5.1），它会按 ANSI 码页读这个无 BOM 的 UTF-8 脚本，
          # 中文会变成乱码，而 annotation 是我们唯一能匿名看到的 CI 诊断通道。
          $distDirs = @(Get-ChildItem -Path build -Recurse -Directory -Filter '*.dist' -ErrorAction SilentlyContinue)
          $distDir = $distDirs | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $distDir) {
            $tree = Get-ChildItem -Path build -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 40 | ForEach-Object { $_.FullName }
            Write-Host ("::error::no *.dist directory under build; Nuitka output path changed? || build tree: " + ($tree -join ' | '))
            exit 1
          }
          $dist = $distDir.FullName
          Write-Host "dist = $dist"

          $required = @(
            "webui\index.html",
            "locales\zh.json",
            "locales\en.json",
            "locales\ru.json",
            "locales\neko.json"
          )

          # --include-data-dir 正常会把这些拷好，但它漏过，所以缺什么就从源码目录补拷一次，
          # 并用 ::warning:: 记一笔：CI 日志要登录才能看，annotation 却是公开可读的，
          # 这样「Nuitka 到底漏了什么」以后不用登录也能查到。
          $repaired = @()
          foreach ($rel in $required) {
            if (Test-Path -LiteralPath (Join-Path $dist $rel)) { continue }
            $top = $rel.Split('\')[0]
            $destDir = Join-Path $dist $top
            try {
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "$top\*") -Destination $destDir -Recurse -Force
              $repaired += $rel
            } catch {
              Write-Host ("::error::copy from source failed for " + $rel + ": " + $_.Exception.Message)
            }
          }
          if ($repaired.Count -gt 0) {
            Write-Host "::warning::Nuitka did not bundle these assets; copied from source: $($repaired -join ', ')"
          }

          $missing = @()
          foreach ($rel in $required) {
            if (Test-Path -LiteralPath (Join-Path $dist $rel)) {
              Write-Host "  ok   $rel"
            } else {
              Write-Host "  MISSING $rel"
              $missing += $rel
            }
          }
          if ($missing.Count -gt 0) {
            $tree = Get-ChildItem -Path $dist -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 40 | ForEach-Object { $_.FullName.Substring($dist.Length) }
            Write-Host ("::error::dist is missing required assets: " + ($missing -join ', ') + " || dist tree: " + ($tree -join ' | '))
            exit 1
          }

      - name: List build output
        run: |
          $dist = (Get-ChildItem -Path build -Recurse -Directory -Filter '*.dist' -ErrorAction SilentlyContinue |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $dist) {
            Write-Host "::error::no *.dist directory under build"
            exit 1
          }
          Get-ChildItem -Path $dist | Select-Object FullName, Length

      - name: Compress build output
        shell: powershell
        run: |
          # 别硬编码 start.dist：Nuitka 的输出目录名可能随版本变，直接找 build 下最新的 *.dist。
          $source = (Get-ChildItem -Path build -Recurse -Directory -Filter '*.dist' -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $source) {
            Write-Host "::error::no *.dist directory under build, nothing to compress"
            exit 1
          }

          # 写入版本信息文件（standalone 模式下 version.json 直接放在 exe 旁）
          $versionFile = Join-Path $source "version.json"
          $json = @{
            version = "${{ github.ref_name }}" -replace '^v', ''
            tag_name = "${{ github.ref_name }}"
          } | ConvertTo-Json
          # 必须写成不带 BOM 的 UTF-8。Windows PowerShell 5.1 的
          # `Set-Content -Encoding UTF8` 会加上 BOM，而 Python 侧 json.load
          # 会因此抛 JSONDecodeError——更新检查就此变成哑的，界面上只是永远
          # 显示「已是最新版」，一点报错都没有。下面那条断言就是防它回来。
          [IO.File]::WriteAllText($versionFile, $json, (New-Object Text.UTF8Encoding $false))
          Write-Host "Created $versionFile"

          $bytes = [IO.File]::ReadAllBytes($versionFile)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and
              $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "version.json 带了 UTF-8 BOM，Python 侧读不出来"
            exit 1
          }
          if (([Text.Encoding]::UTF8.GetString($bytes)) -notmatch '"version"') {
            Write-Error "version.json 内容里没有 version 字段"
            exit 1
          }
          Write-Host "version.json 无 BOM，内容已校验"

          $zipFile = "MSTL-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $zipFile -Force
          Write-Host "Created $zipFile"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSTL-${{ github.ref_name }}
          path: MSTL-${{ github.ref_name }}.zip

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: MSTL-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
