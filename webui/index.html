<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSTL</title>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --card:#ffffff; --console:#f6f8fa; --line:#e4e7ec;
    --fg:#1f2430; --dim:#6b7480; --hover:#f2f4f7; --sel:#f5f6fe;
    --accent:#4c5bd4; --accent-2:#6b78e6; --accent-3:#3f4cc4;
    --tint:#f7f8ff; --tint-2:#eef0fd;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
  }
  *{box-sizing:border-box}
  /* 作者样式优先于浏览器默认样式，所以下面那些 display:flex 会把 UA 的
     [hidden]{display:none} 顶掉——被隐藏的面板反而一直看得见。这条兜住它。 */
  [hidden]{display:none !important}
  body{margin:0;color:var(--fg);
       background-color:#ffffff;
       background-image:linear-gradient(180deg,var(--tint) 0,#ffffff 260px);
       background-repeat:no-repeat;
       background-attachment:fixed;
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
  header{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#ffffff,#fbfcff);
         display:flex;align-items:center;gap:12px}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
                opacity:.55;pointer-events:none;
                background:linear-gradient(90deg,var(--accent) 0,var(--accent-2) 32%,
                           rgba(76,91,212,0) 100%)}
  header b{font-size:16px}
  header .sp{flex:1}

  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;
        background:var(--dim);transition:background .2s,box-shadow .2s}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(26,127,55,.14)}
  .dot.connecting{background:var(--warn);box-shadow:0 0 0 3px rgba(154,103,0,.14)}
  .dot.offline{background:var(--err);box-shadow:0 0 0 3px rgba(207,34,46,.14)}

  main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 54px)}
  #list{border-right:1px solid var(--line);overflow:auto;padding:10px}
  .empty{color:var(--dim);padding:14px 6px}
  .item{background:linear-gradient(180deg,#ffffff,#fdfdff);
        border:1px solid var(--line);border-radius:8px;
        padding:10px;margin-bottom:8px;cursor:pointer;
        transition:background .12s,border-color .12s,box-shadow .12s}
  .item:hover{background:linear-gradient(180deg,#fbfcff,var(--hover))}
  .item.sel{border-color:var(--accent);
            background:linear-gradient(135deg,var(--tint-2),var(--tint));
            box-shadow:0 0 0 3px rgba(76,91,212,.08)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .name{font-weight:600}
  .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .badge{font-size:12px;padding:1px 8px;border-radius:99px;
         border:1px solid var(--line);color:var(--dim);white-space:nowrap;
         background:linear-gradient(180deg,#ffffff,#f7f8fa)}
  .badge.running{color:var(--ok);border-color:#9fd3ae;
                 background:linear-gradient(180deg,#f2fbf5,#e7f6ec)}
  .badge.stopping{color:var(--warn);border-color:#e6cf94;
                  background:linear-gradient(180deg,#fffaf0,#fdf3dd)}

  button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid var(--line);
         background:#ffffff;color:var(--fg);cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--hover);border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent) 55%,var(--accent-3));
                 border-color:var(--accent);color:#ffffff;
                 box-shadow:0 1px 2px rgba(76,91,212,.22)}
  button.primary:hover:not(:disabled){background:linear-gradient(135deg,#7b86ee,#4c5bd4 55%,#37429f);
                 border-color:var(--accent-3);color:#ffffff}
  button:disabled{opacity:.45;cursor:default}
  button.on{border-color:var(--accent);color:var(--accent);background:var(--sel)}

  #pane{position:relative;display:flex;flex-direction:column;min-width:0}
  #head{padding:12px 16px;border-bottom:1px solid var(--line);
        background:linear-gradient(180deg,#ffffff,#fbfcff);
        display:flex;align-items:center;gap:10px}
  #head .sp{flex:1}

  #details{display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px;
           border-bottom:1px solid var(--line);background:#ffffff}
  #details:empty{display:none}
  .chip{font-size:12px;max-width:52ch;padding:2px 9px;border-radius:6px;
        color:var(--dim);border:1px solid var(--line);
        background:linear-gradient(180deg,#ffffff,#fbfcff);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip b{color:var(--fg);font-weight:600}

  #log{flex:1;overflow:auto;margin:0;padding:12px 16px;white-space:pre-wrap;
       word-break:break-all;color:#24292f;
       background:linear-gradient(180deg,#f8fafc,#f3f5f9 55%,#f6f8fa);
       font:12.5px/1.6 ui-monospace,Consolas,monospace}
  #log .note{color:var(--dim)}
  #log .input{color:var(--accent);font-weight:600}
  #log .warn{color:var(--warn)}
  #log .error{color:var(--err)}

  #jump{position:absolute;right:22px;bottom:112px;border-radius:99px;
        box-shadow:0 3px 10px rgba(31,36,48,.14);font-size:12px;padding:4px 12px}

  #bar{display:flex;flex-direction:column;gap:8px;padding:10px 16px;
       border-top:1px solid var(--line);
       background:linear-gradient(180deg,#ffffff,#fbfcff)}
  #chips{display:flex;flex-wrap:wrap;gap:6px}
  #chips button{font-size:12px;padding:3px 10px;border-radius:99px;color:var(--dim)}
  #line{display:flex;gap:8px}
  #cmd{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
       background:#ffffff;color:var(--fg);font:12.5px ui-monospace,Consolas,monospace}
  #cmd::placeholder{color:var(--dim)}
  #cmd:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,91,212,.12)}

  /* ---------------------------------------------------------- 标签与文件管理器 */
  .tab{font-size:12px;padding:3px 12px;border-radius:99px;color:var(--dim)}
  .tab.on{color:var(--accent);border-color:var(--accent);background:var(--sel)}

  #files{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff}
  #fbar{display:flex;align-items:center;gap:8px;padding:8px 14px;
        border-bottom:1px solid var(--line);flex-wrap:wrap;
        background:linear-gradient(180deg,#fff,#fbfcff)}
  #fpath{font:12.5px ui-monospace,Consolas,monospace;color:var(--dim);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
  #flist{flex:1;overflow:auto}
  #flist table{width:100%;border-collapse:collapse;font-size:13px}
  #flist th{position:sticky;top:0;z-index:1;text-align:left;font-weight:600;
            color:var(--dim);font-size:12px;padding:7px 12px;
            background:linear-gradient(180deg,#ffffff,#fbfcff);
            border-bottom:1px solid var(--line)}
  #flist td{padding:6px 12px;border-bottom:1px solid #f1f3f6;vertical-align:middle}
  #flist tr:hover td{background:var(--hover)}
  #flist .fname{display:flex;align-items:center;gap:7px;cursor:pointer;min-width:0}
  #flist .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #flist .fico{flex:0 0 auto;width:16px;text-align:center}
  #flist .fdir{font-weight:600}
  #flist .fmeta{color:var(--dim);font-size:12px;white-space:nowrap}
  #flist .fops{display:flex;gap:5px;justify-content:flex-end}
  #flist .fops button{padding:2px 9px;font-size:12px}
  .fempty{color:var(--dim);padding:18px 14px}

  #editor{position:absolute;inset:0;display:flex;flex-direction:column;
          background:#fff;z-index:5}
  #ebar{display:flex;align-items:center;gap:8px;padding:9px 14px;
        border-bottom:1px solid var(--line)}
  #epath{font:12.5px ui-monospace,Consolas,monospace;color:var(--dim);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #etext{flex:1;border:0;outline:none;resize:none;padding:12px 15px;
         font:12.5px/1.65 ui-monospace,Consolas,monospace;color:#24292f;
         background:#fbfcfd;tab-size:4}

  /* ---------------------------------------------------------------- 对话框 */
  #modal,#setmodal,#frpmodal{position:fixed;inset:0;background:rgba(31,36,48,.34);z-index:20;
         display:flex;align-items:center;justify-content:center;padding:18px}
  .dialog{background:#fff;border:1px solid var(--line);border-radius:12px;
          box-shadow:0 18px 48px rgba(31,36,48,.24);width:min(640px,100%);
          max-height:100%;display:flex;flex-direction:column;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;
         border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#ffffff,#fbfcff)}
  .dhead b{font-size:15px}
  .dtabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
  .dbody{padding:14px 16px 16px;overflow:auto}
  .drow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
  .field label{font-size:12px;color:var(--dim)}
  .field input,.field select{padding:7px 9px;border-radius:6px;
        border:1px solid var(--line);background:#fff;color:var(--fg);
        font:13px system-ui;min-width:0}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(76,91,212,.12)}
  .hint{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:10px}
  .dactions{display:flex;gap:8px;justify-content:flex-end;
            padding-top:6px;flex-wrap:wrap}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
         background:#1f2430;color:#fff;padding:9px 15px;border-radius:8px;
         font-size:13px;box-shadow:0 8px 22px rgba(31,36,48,.28);z-index:40;
         max-width:min(560px,92vw)}
  #toast.err{background:var(--err)}

  /* 长任务进度条（下载服务端核心、下载 frpc、上传文件） */
  #job{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);
       display:flex;align-items:center;gap:10px;background:#ffffff;
       border:1px solid var(--line);border-radius:10px;padding:8px 14px;
       box-shadow:0 8px 22px rgba(31,36,48,.16);z-index:38;font-size:13px;
       max-width:min(600px,92vw)}
  #jobbar{width:170px;height:6px;border-radius:99px;flex:0 0 auto;
          background:var(--tint-2);overflow:hidden}
  #jobfill{height:100%;width:0;border-radius:99px;
           background:linear-gradient(90deg,var(--accent-2),var(--accent));
           transition:width .15s linear}
  #joblabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #jobpct{color:var(--dim);font-size:12px;flex:0 0 auto;
          font-variant-numeric:tabular-nums}

  @media (max-width:780px){
    main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    #list{border-right:none;border-bottom:1px solid var(--line);max-height:34vh}
    #jump{bottom:132px}
  }
</style>
</head>
<body>
<header>
  <b id="title">MSTL</b>
  <span class="dot" id="conn"></span>
  <span class="sp"></span>
  <button id="frpbtn">frp</button>
  <button id="newinst">＋</button>
  <button id="refresh">⟳</button>
</header>
<main>
  <div id="list"></div>
  <div id="pane">
    <div id="head">
      <span class="name" id="cur"></span>
      <span class="badge" id="curstate"></span>
      <span class="sp"></span>
      <button class="tab" id="tab-console"></button>
      <button class="tab" id="tab-files"></button>
      <button id="instset">⚙</button>
      <button id="clear"></button>
      <button id="follow"></button>
    </div>
    <div id="details"></div>
    <pre id="log"></pre>
    <div id="files" hidden>
      <div id="fbar">
        <button id="fup" title="..">↑</button>
        <button id="froot">/</button>
        <span id="fpath"></span>
        <span class="sp" style="flex:1"></span>
        <button id="fnewfile"></button>
        <button id="fnewdir"></button>
        <button id="fupload"></button>
        <button id="fuploaddir"></button>
        <button id="frefresh">⟳</button>
      </div>
      <input type="file" id="fupload-input" hidden>
      <input type="file" id="fupload-dir-input" webkitdirectory directory multiple hidden>
      <div id="flist"></div>
      <div id="editor" hidden>
        <div id="ebar">
          <span id="epath"></span>
          <span class="sp" style="flex:1"></span>
          <button class="primary" id="esave"></button>
          <button id="ecancel"></button>
        </div>
        <textarea id="etext" spellcheck="false" autocomplete="off"></textarea>
      </div>
    </div>
    <button id="jump" hidden></button>
    <div id="bar">
      <div id="chips"></div>
      <div id="line">
        <input id="cmd" spellcheck="false" autocomplete="off">
        <button class="primary" id="send"></button>
      </div>
    </div>
  </div>
</main>

<div id="modal" hidden>
  <div class="dialog">
    <div class="dhead">
      <b id="dtitle"></b>
      <span style="flex:1"></span>
      <button id="dclose">✕</button>
    </div>
    <div class="dtabs">
      <button class="tab on" id="ntab-core"></button>
      <button class="tab" id="ntab-jar"></button>
      <button class="tab" id="ntab-import"></button>
      <button class="tab" id="ntab-generic"></button>
    </div>
    <div class="dbody">
      <div id="npane-core">
        <div class="drow">
          <div class="field">
            <label id="l-core"></label>
            <select id="ni-core"></select>
          </div>
          <div class="field">
            <label id="l-version"></label>
            <select id="ni-version"></select>
          </div>
        </div>
        <div class="hint" id="ni-core-desc"></div>
        <div class="drow">
          <div class="field">
            <label id="l-name"></label>
            <input id="ni-name" placeholder="">
          </div>
          <div class="field">
            <label id="l-mcver"></label>
            <input id="ni-mcver" placeholder="">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-minmem"></label>
            <input id="ni-minmem" value="1G">
          </div>
          <div class="field">
            <label id="l-maxmem"></label>
            <input id="ni-maxmem" value="4G">
          </div>
        </div>
        <div class="dactions">
          <button id="ni-create"></button>
          <button id="ni-blank"></button>
        </div>
      </div>

      <div id="npane-jar" hidden>
        <div class="hint" id="ni-jar-hint"></div>
        <div class="drow">
          <div class="field">
            <label id="l-jarfile"></label>
            <input type="file" id="ni-jarfile" accept=".jar">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-name2"></label>
            <input id="ni-jarname" placeholder="">
          </div>
          <div class="field">
            <label id="l-minmem2"></label>
            <input id="ni-jarmin" value="1G">
          </div>
          <div class="field">
            <label id="l-maxmem2"></label>
            <input id="ni-jarmax" value="4G">
          </div>
        </div>
        <div class="dactions">
          <button class="primary" id="ni-jar-create"></button>
        </div>
      </div>

      <div id="npane-import" hidden>
        <div class="hint" id="ni-import-hint"></div>
        <div class="drow">
          <div class="field" style="flex:3">
            <label id="l-zippath"></label>
            <input id="ni-zip" placeholder="D:\backup\server.zip">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-importjar"></label>
            <select id="ni-importjar"></select>
          </div>
          <div class="field">
            <label id="l-name3"></label>
            <input id="ni-importname" placeholder="">
          </div>
        </div>
        <div class="dactions">
          <button id="ni-scan"></button>
          <button class="primary" id="ni-import"></button>
        </div>
      </div>

      <div id="npane-generic" hidden>
        <div class="drow">
          <div class="field">
            <label id="l-gname"></label>
            <input id="ni-gname" placeholder="">
          </div>
          <div class="field">
            <label id="l-gmode"></label>
            <select id="ni-gmode">
              <option value="exec"></option>
              <option value="cmd"></option>
              <option value="powershell"></option>
            </select>
          </div>
        </div>
        <div id="ni-gprog">
          <div class="drow">
            <div class="field">
              <label id="l-gprogram"></label>
              <input id="ni-gprogram" placeholder="start.bat">
            </div>
          </div>
          <div class="hint" id="ni-gprogram-hint"></div>
          <div class="drow">
            <div class="field">
              <label id="l-gargs"></label>
              <input id="ni-gargs" placeholder="--port 8080">
            </div>
          </div>
          <div class="hint" id="ni-gargs-hint"></div>
        </div>
        <div id="ni-gcmd" hidden>
          <div class="drow">
            <div class="field">
              <label id="l-gcommand"></label>
              <input id="ni-gcommand" placeholder="echo hello">
            </div>
          </div>
          <div class="hint" id="ni-gcommand-hint"></div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-gworkdir"></label>
            <input id="ni-gworkdir">
          </div>
        </div>
        <div class="hint" id="ni-gworkdir-hint"></div>
        <div class="dactions">
          <button class="primary" id="ni-gcreate"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="setmodal" hidden>
  <div class="dialog">
    <div class="dhead">
      <b id="settitle"></b>
      <span style="flex:1"></span>
      <button id="setclose">✕</button>
    </div>
    <div class="dbody">
      <div class="hint" id="setkind"></div>
      <div class="drow">
        <div class="field">
          <label id="l-setprio"></label>
          <select id="setprio">
            <option value="normal">normal</option>
            <option value="below_normal">below_normal</option>
            <option value="low">low</option>
          </select>
        </div>
      </div>
      <div class="drow">
        <label style="display:flex;gap:6px;align-items:center;font-size:13px">
          <input type="checkbox" id="setinstauto" style="min-width:auto">
          <span id="l-setinstauto"></span>
        </label>
      </div>
      <div class="hint" id="set-instauto-hint"></div>
      <div id="set-mc">
        <div class="drow">
          <div class="field">
            <label id="l-setmcver"></label>
            <input id="setmcver">
          </div>
          <div class="field">
            <label id="l-setjar"></label>
            <input id="setjar">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-setminmem"></label>
            <input id="setminmem">
          </div>
          <div class="field">
            <label id="l-setmaxmem"></label>
            <input id="setmaxmem">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-setjvm"></label>
            <input id="setjvm" placeholder="-XX:+UseG1GC">
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-setsrv"></label>
            <input id="setsrv" placeholder="--forceUpgrade">
          </div>
        </div>
      </div>
      <div id="set-generic" hidden>
        <div class="drow">
          <div class="field">
            <label id="l-setgmode"></label>
            <select id="setgmode">
              <option value="exec"></option>
              <option value="cmd"></option>
              <option value="powershell"></option>
            </select>
          </div>
        </div>
        <div id="setg-prog">
          <div class="drow">
            <div class="field">
              <label id="l-setgprogram"></label>
              <input id="setgprogram">
            </div>
          </div>
          <div class="drow">
            <div class="field">
              <label id="l-setgargs"></label>
              <input id="setgargs">
            </div>
          </div>
        </div>
        <div id="setg-cmd" hidden>
          <div class="drow">
            <div class="field">
              <label id="l-setgcommand"></label>
              <input id="setgcommand">
            </div>
          </div>
        </div>
        <div class="drow">
          <div class="field">
            <label id="l-setgworkdir"></label>
            <input id="setgworkdir">
          </div>
        </div>
      </div>
      <div class="drow" style="margin-top:8px">
        <b id="l-setopenfrp" style="font-size:13px"></b>
      </div>
      <div class="hint" id="set-openfrp-hint"></div>
      <div class="drow">
        <div class="field">
          <label id="l-settoken"></label>
          <input id="settoken" autocomplete="off">
        </div>
        <div class="field">
          <label id="l-setproxyid"></label>
          <input id="setproxyid" placeholder="0">
        </div>
      </div>
      <div class="drow">
        <label style="display:flex;gap:6px;align-items:center;font-size:13px">
          <input type="checkbox" id="setautostart" style="min-width:auto">
          <span id="l-setauto"></span>
        </label>
      </div>
      <div class="dactions">
        <button class="primary" id="setsave"></button>
      </div>
    </div>
  </div>
</div>

<div id="frpmodal" hidden>
  <div class="dialog">
    <div class="dhead">
      <b id="frptitle"></b>
      <span style="flex:1"></span>
      <button id="frpclose">✕</button>
    </div>
    <div class="dbody">
      <div class="drow" style="align-items:center">

<script>
const $ = (id) => document.getElementById(id);
const MAX_LINES = 2000;
const QUICK = [
  { text: "list" },
  { text: "save-all" },
  { text: "help" },
  { text: "say ", prefill: true }
];

let strings = {};
let instances = [];
let selected = null;
let stream = null;
let follow = true;
let lastAtBottom = true;

// 按实例缓存控制台输出。服务端只在 SSE 建连时重放一次历史，而连接建立时
// 用户往往还没选中任何实例——原来这些行会因为 instance !== selected 被直接
// 丢掉，之后选中实例只看到一片空白，要等下一行新输出才「活」过来。
let buffers = {};
// 每个实例已画到的事件序号，用于过滤断线重连后的历史重放
let lastSeq = {};

function fmt(tpl, values) {
  return String(tpl == null ? "" : tpl).replace(/\{(\w+)\}/g, (m, k) =>
    Object.prototype.hasOwnProperty.call(values, k) ? values[k] : m);
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function baseName(path) {
  return String(path || "").split(/[\\/]/).pop();
}

async function api(path, body) {
  const options = { method: body ? "POST" : "GET", headers: {} };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  if (res.status === 401) {
    // 光说「token 无效」用户只能干瞪眼：最常见的三种原因（旧 cookie、
    // localhost 与 127.0.0.1 不通用、刚换过 token）都列出来
    const hints = ["web.auth.hint_cookie", "web.auth.hint_host",
      "web.auth.hint_regenerate"]
      .map((k) => strings[k]).filter(Boolean)
      .map((s) => "<li>" + esc(s) + "</li>").join("");
    document.body.innerHTML =
      '<div style="padding:28px"><h3>' + esc(strings["web.auth.invalid"] || "401") +
      '</h3><p style="color:#6b7480">' + esc(strings["web.auth.help"] || "") + "</p>" +
      (hints ? '<ul style="color:#6b7480;line-height:1.9">' + hints + "</ul>" : "") +
      "</div>";
    throw new Error("unauthorized");
  }
  return res.json();
}

/* ---------------------------------------------------------------- 连接状态 */

function setConn(state) {
  const dot = $("conn");
  dot.className = "dot " + state;
  dot.title = strings["web.conn." + (state === "online" ? "online"
    : state === "connecting" ? "connecting" : "offline")] || state;
}

function connect() {
  if (stream) stream.close();
  setConn("connecting");
  // 不带 name：一条流同时盯住所有实例
  stream = new EventSource("/api/stream");
  stream.onopen = () => setConn("online");
  stream.onerror = () => {
    // EventSource 会自己重连：只有它彻底放弃了，才值得显示成断开
    setConn(stream && stream.readyState === 2 ? "offline" : "connecting");
  };
  stream.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    setConn("online");
    handle(event);
  };
}

function alreadySeen(event) {
  // 每条事件都带实例内单调递增的 seq。EventSource 断线重连时服务端会把
  // 历史整段重放一遍，靠它把画过的行筛掉，否则日志里会出现成片重复。
  const name = event.instance;
  const seq = typeof event.seq === "number" ? event.seq : null;
  if (seq === null) return false;
  if (lastSeq[name] !== undefined && seq <= lastSeq[name]) return true;
  lastSeq[name] = seq;
  return false;
}

function bufferLine(event) {
  if (event.type !== "line") return null;
  const cls = event.kind === "note" ? "note"
            : event.kind === "input" ? "input"
            : lineClass(event.text);
  const text = event.kind === "input" ? "> " + (event.text || "") : (event.text || "");
  const name = event.instance;
  const buf = buffers[name] || (buffers[name] = []);
  const entry = { cls, text };
  buf.push(entry);
  if (buf.length > MAX_LINES) buf.splice(0, buf.length - MAX_LINES);
  return entry;
}

function handle(event) {
  if (alreadySeen(event)) return;
  if (event.type === "job") {
    showJob(event);
    return;
  }
  if (event.type === "state") {
    const item = instances.find(x => x.name === event.instance);
    if (item) {
      item.state = event.state;
      item.exit_code = event.exit_code;
      item.pid = event.pid;
    }
    render();
    renderDetails();
    return;
  }
  const entry = bufferLine(event);
  if (entry && event.instance === selected) appendLine(entry.cls, entry.text);
}

function stateLabel(state) {
  return strings["web.state." + state] || state;
}

function render() {
  const box = $("list");
  box.innerHTML = "";
  if (!instances.length) {
    box.innerHTML = '<div class="empty">' + esc(strings["web.panel.no_instances"] || "") + "</div>";
  }
  instances.forEach(item => {
    const state = item.state || "stopped";
    const generic = (item.kind || "minecraft") === "generic";
    const sub = generic
      ? (strings["web.new.tab_generic"] || "generic")
      : (item.mc_version || "?") + " · " + (item.jar || "?");
    const el = document.createElement("div");
    el.className = "item" + (item.name === selected ? " sel" : "");
    el.innerHTML =
      '<div class="row"><span class="name">' + esc(item.name) + "</span>" +
      '<span class="badge ' + esc(state) + '">' + esc(stateLabel(state)) + "</span></div>" +
      '<div class="meta">' + esc(sub) + "</div>" +
      '<div class="row" style="margin-top:8px">' +
      '<button data-act="start"' + (state !== "stopped" ? " disabled" : "") + ">" +
      esc(strings["web.panel.start"] || "Start") + "</button>" +
      '<button data-act="stop"' + (state !== "running" ? " disabled" : "") + ">" +
      esc(strings["web.panel.stop"] || "Stop") + "</button></div>";

    el.onclick = (ev) => {
      const act = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-act");
      if (act === "start") {
        // 顺便把它选上，否则点了启动却在右边控制台里看不到任何反应
        select(item.name);
        api("/api/start", { name: item.name }).then(refresh).catch(() => {});
      } else if (act === "stop") {
        api("/api/stop", { name: item.name }).then(refresh).catch(() => {});
      } else {
        select(item.name);
      }
    };
    box.appendChild(el);
  });

  const cur = instances.find(x => x.name === selected);
  const st = cur ? (cur.state || "stopped") : "";
  $("cur").textContent = cur ? cur.name : "";
  $("curstate").textContent = cur ? stateLabel(st) : "";
  $("curstate").className = "badge " + st;
  $("instset").disabled = !cur;
}

/* ---------------------------------------------------------------- 详情条 */

function renderDetails() {
  const box = $("details");
  const item = instances.find(x => x.name === selected);
  box.innerHTML = "";
  if (!item) return;

  const chips = [];
  const generic = (item.kind || "minecraft") === "generic";
  // 通用实例没有内存与 Java 的概念，别摆一排空占位
  if (!generic && (item.min_mem || item.max_mem)) {
    chips.push({ text: fmt(strings["web.detail.memory"], { min: item.min_mem || "?", max: item.max_mem || "?" }) });
  }
  if (item.state === "running" && item.pid) {
    chips.push({ text: fmt(strings["web.detail.pid"], { pid: item.pid }) });
  } else if (item.exit_code !== null && item.exit_code !== undefined) {
    chips.push({ text: fmt(strings["web.detail.exit_code"], { code: item.exit_code }) });
  }
  if (generic) {
    const launch = item.launch || {};
    const modeLabel = { exec: strings["web.new.launch_exec"],
                        cmd: strings["web.new.launch_cmd"],
                        powershell: strings["web.new.launch_powershell"] }[launch.mode || "exec"]
                      || (launch.mode || "exec");
    chips.push({ text: strings["web.new.tab_generic"] + ": " + modeLabel });
    const target = (launch.mode || "exec") === "exec"
      ? (launch.program || "") : (launch.command || "");
    if (target) chips.push({ text: target, title: target });
  } else if (item.java) {
    chips.push({ text: "Java " + baseName(item.java), title: item.java });
  }
  if (item.workdir) {
    chips.push({ text: fmt(strings["web.detail.workdir"], { path: item.workdir }), title: item.workdir });
  }
  if (item.command && item.command.length) {
    chips.push({ text: (strings["web.detail.command"] || "command") + ": " + item.command.join(" "),
                 title: item.command.join(" ") });
  }

  chips.forEach(c => {
    const el = document.createElement("span");
    el.className = "chip";
    el.textContent = c.text;
    if (c.title) el.title = c.title;
    box.appendChild(el);
  });
}

/* ---------------------------------------------------------------- 控制台 */

function lineClass(text) {
  if (/\b(ERROR|SEVERE|FATAL)\b/.test(text) || /Exception|\bat [\w.$]+\([\w.]+\.java:\d+\)/.test(text)) {
    return "error";
  }
  if (/\bWARN(ING)?\b/.test(text)) return "warn";
  return "";
}

function appendLine(cls, text) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  const log = $("log");
  log.appendChild(el);
  while (log.childElementCount > MAX_LINES) log.removeChild(log.firstChild);
  if (follow) log.scrollTop = log.scrollHeight;
}

function renderLog() {
  const log = $("log");
  const entries = buffers[selected] || [];
  const frag = document.createDocumentFragment();
  entries.forEach(entry => {
    const el = document.createElement("div");
    if (entry.cls) el.className = entry.cls;
    el.textContent = entry.text;
    frag.appendChild(el);
  });
  log.innerHTML = "";
  log.appendChild(frag);
  log.scrollTop = log.scrollHeight;
  $("jump").hidden = true;
}

function clearLog() {
  buffers[selected] = [];
  $("log").innerHTML = "";
  $("jump").hidden = true;
  lastAtBottom = true;
}

function setFollow(value) {
  follow = value;
  applyStrings();
  if (follow) {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
    $("jump").hidden = true;
  }
}

$("log").addEventListener("scroll", () => {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
  lastAtBottom = atBottom;
  if (!atBottom && follow) {
    follow = false;
    applyStrings();
  }
  $("jump").hidden = atBottom;
  if (atBottom && !follow) {
    // 用户自己滚到底了，把跟随接回来
    follow = true;
    applyStrings();
  }
});

/* ---------------------------------------------------------------- 选择 */

function select(name) {
  selected = name;
  try { localStorage.setItem("mstl.selected", name || ""); } catch (e) {}
  // 历史行一直存在本地缓冲里，这里直接整段画出来，不必重连那条全局流
  renderLog();
  render();
  renderDetails();
  // 文件管理器是按实例的，换实例就得回到根目录重新列
  if (tab === "files") loadFiles("");
}

/* ---------------------------------------------------------------- 指令 */

function sendCommand(text) {
  const value = (text == null ? $("cmd").value : text).trim();
  if (!value || !selected) return;
  $("cmd").value = "";
  api("/api/command", { name: selected, command: value }).then(refresh).catch(() => {});
}

function buildChips() {
  const box = $("chips");
  box.innerHTML = "";
  QUICK.forEach(q => {
    const el = document.createElement("button");
    el.textContent = q.text.trim();
    el.onclick = () => {
      if (q.prefill) {
        $("cmd").value = q.text;
        $("cmd").focus();
      } else {
        sendCommand(q.text);
      }
    };

/* ---------------------------------------------------------------- 通用提示 */

let toastTimer = null;

function toast(message, isError) {
  const el = $("toast");
  el.textContent = message || "";
  el.className = isError ? "err" : "";
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 6000 : 2600);
}

function fail(err) {
  toast((err && err.message) ? err.message : String(err), true);
}

/* 长任务进度条：下载/上传的进度从服务端的 SSE 来，或者由 XHR 自己报。 */
let jobHideTimer = null;

function showJob(event) {
  const ratio = typeof event.ratio === "number" ? event.ratio : 0;
  $("joblabel").textContent = event.label || "";
  $("jobfill").style.width = Math.round(ratio * 100) + "%";
  $("jobpct").textContent = Math.round(ratio * 100) + "%";
  $("job").hidden = false;
  if (jobHideTimer) clearTimeout(jobHideTimer);
  if (event.done) {
    jobHideTimer = setTimeout(() => { $("job").hidden = true; }, 700);
  }
}

/* 包一层：任务开始时把进度条摆出来，无论成败最后都收掉 */
async function withProgress(label, task) {
  showJob({ label: label, ratio: 0 });
  try {
    return await task((ratio) => showJob({ label: label, ratio: ratio }));
  } finally {
    showJob({ label: label, ratio: 1, done: true });
  }
}

/* fetch() 报不了上传进度，上传统一走 XHR */
function uploadWithProgress(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && data.ok !== false) resolve(data);
      else reject(new Error(data.message || ("HTTP " + xhr.status)));
    };
    xhr.onerror = () => reject(new Error("network error"));
    xhr.send(file);
  });
}

/* api() 只负责取回 JSON；业务失败由 core 以 {ok:false,message} 表达，
   这里统一转成异常，调用方一个 catch 就能兜住所有情况。 */
async function apiOk(path, body) {
  const data = await api(path, body);
  if (data && data.ok === false) throw new Error(data.message || "error");
  return data;
}

let filesPath = "";
let filesParent = "";
let editorPath = null;

function joinPath(base, name) {
  return base ? base + "/" + name : name;
}

function fmtSize(bytes) {
  if (!bytes) return "";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let value = bytes;
  let i = 0;
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i += 1; }
  return (i === 0 ? String(value) : value.toFixed(1)) + " " + units[i];
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function opButton(symbol, title, handler) {
  const b = document.createElement("button");
  b.textContent = symbol;
  if (title) b.title = title;
  b.onclick = (ev) => { ev.stopPropagation(); handler(); };
  return b;
}

function renderFiles(entries, parent) {
  $("fpath").textContent = "/" + (filesPath || "");
  const box = $("flist");
  box.innerHTML = "";

  if (!selected) {
    const hint = document.createElement("div");
    hint.className = "fempty";
    hint.textContent = strings["web.panel.no_instances"] || "";
    box.appendChild(hint);
    return;
  }

  const table = document.createElement("table");
  const head = document.createElement("thead");
  const headRow = document.createElement("tr");
  [strings["web.files.name"] || "Name",
   strings["web.files.size"] || "Size",
   strings["web.files.modified"] || "Modified", ""].forEach((label) => {
    const th = document.createElement("th");
    th.textContent = label;
    headRow.appendChild(th);
  });
  head.appendChild(headRow);
  table.appendChild(head);

  const tbody = document.createElement("tbody");
  if (filesPath) {
    tbody.appendChild(buildFileRow(
      { name: "..", path: parent, dir: true, size: 0, mtime: 0, editable: false },
      true));
  }
  if (!entries.length && !filesPath) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.className = "fempty";
    td.textContent = strings["web.files.empty"] || "";
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  entries.forEach((entry) => tbody.appendChild(buildFileRow(entry, false)));
  table.appendChild(tbody);
  box.appendChild(table);
}

function buildFileRow(entry, isUp) {
  const tr = document.createElement("tr");

  const nameTd = document.createElement("td");
  const nameBox = document.createElement("div");
  nameBox.className = "fname" + (entry.dir ? " fdir" : "");
  const icon = document.createElement("span");
  icon.className = "fico";
  icon.textContent = entry.dir ? "📁" : (entry.editable ? "📄" : "📦");
  const label = document.createElement("span");
  label.textContent = entry.name;
  nameBox.appendChild(icon);
  nameBox.appendChild(label);
  nameBox.onclick = () => {
    if (entry.dir) loadFiles(entry.path);
    else if (entry.editable) openEditor(entry.path);
    else downloadFile(entry);
  };
  nameTd.appendChild(nameBox);
  tr.appendChild(nameTd);

  const sizeTd = document.createElement("td");
  sizeTd.className = "fmeta";
  sizeTd.textContent = entry.dir ? "" : fmtSize(entry.size);
  tr.appendChild(sizeTd);

  const timeTd = document.createElement("td");
  timeTd.className = "fmeta";
  timeTd.textContent = isUp ? "" : fmtTime(entry.mtime);
  tr.appendChild(timeTd);

  const opsTd = document.createElement("td");
  const ops = document.createElement("div");
  ops.className = "fops";
  if (!isUp) {
    if (!entry.dir) {
      ops.appendChild(opButton("⭳", strings["web.files.download"], () => downloadFile(entry)));
      if (entry.archive) {
        ops.appendChild(opButton("⇲", strings["web.files.extract"], () => extractEntry(entry)));
      }
      if (entry.editable) {
        ops.appendChild(opButton("✎", strings["web.files.edit"], () => openEditor(entry.path)));
      }
    }
    ops.appendChild(opButton("⇄", strings["web.files.rename"], () => renameEntry(entry)));
    ops.appendChild(opButton("✕", strings["web.files.delete"], () => deleteEntry(entry)));
  }
  opsTd.appendChild(ops);
  tr.appendChild(opsTd);
  return tr;
}

async function uploadFile(file) {
  if (!file || !selected) return;
  const path = joinPath(filesPath, file.name);
  const label = (strings["web.files.uploading"] || "Uploading…") + " " + file.name;
  try {
    // 直接把 File 当请求体发，省掉 multipart 解析；token 走 Cookie
    await withProgress(label, (report) => uploadWithProgress(
      "/api/file/upload?name=" + encodeURIComponent(selected) +
      "&path=" + encodeURIComponent(path), file, report));
    toast(fmt(strings["web.files.upload_done"] || "{name}", { name: file.name }));
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

/* 上传整个文件夹：目录选择器会把每个文件带上 webkitRelativePath，
   照它建目录即可。空目录浏览器不会报，所以建不出来（会在文档里写明）。 */
async function uploadFolder(fileList) {
  if (!fileList || !fileList.length || !selected) return;
  const items = [];
  for (let i = 0; i < fileList.length; i += 1) {
    const file = fileList[i];
    const rel = String(file.webkitRelativePath || file.name).replace(/\\/g, "/");
    items.push({ file: file, rel: rel });
  }
  const total = items.length;
  let done = 0;
  let failed = 0;
  const progressLabel = (n) => fmt(strings["web.files.uploading_folder"] || "{done}/{total}",
                                   { done: n, total: total });

  showJob({ label: progressLabel(0), ratio: 0 });
  for (let i = 0; i < items.length; i += 1) {
    const item = items[i];
    const path = joinPath(filesPath, item.rel);
    try {
      await uploadWithProgress(
        "/api/file/upload?name=" + encodeURIComponent(selected) +
        "&path=" + encodeURIComponent(path), item.file,
        (ratio) => showJob({ label: progressLabel(done), ratio: (done + ratio) / total }));
      done += 1;
    } catch (err) {
      failed += 1;
    }
    showJob({ label: progressLabel(done), ratio: done / total });
  }
  showJob({ label: progressLabel(done), ratio: 1, done: true });

  if (failed) {
    toast(fmt(strings["web.files.folder_partial"] || "{done} ok, {failed} failed",
              { done: done, failed: failed }), true);
  } else {
    toast(fmt(strings["web.files.folder_done"] || "{count} files", { count: done }));
  }
  loadFiles();
}

/* 在线解压：解到压缩包自己所在的目录，已存在的文件跳过不覆盖 */
async function extractEntry(entry) {
  if (!selected) return;
  const ask = fmt(strings["web.files.extract_confirm"] || "Extract {name}?",
                  { name: entry.name });
  if (!window.confirm(ask)) return;
  const label = fmt(strings["web.files.extracting"] || "{name}", { name: entry.name });
  showJob({ label: label, ratio: 0 });
  try {
    // 解压是同步 POST，进度条的收尾由服务端的 job 事件负责；这里只兜底
    const data = await apiOk("/api/file/extract",
                             { name: selected, path: entry.path });
    toast(data.message || "");
    loadFiles();
  } catch (err) {
    fail(err);
  } finally {
    showJob({ label: label, ratio: 1, done: true });
  }
}

  if (!selected) return;
  const item = instances.find(x => x.name === selected);
  if (!item) return;
  const generic = (item.kind || "minecraft") === "generic";

  const body = {
    name: selected,
    process_priority: $("setprio").value,
    auto_start: $("setinstauto").checked,
    openfrp: {
      token: $("settoken").value.trim(),
      proxy_id: parseInt($("setproxyid").value, 10) || 0,
      auto_start: $("setautostart").checked
    }
  };
  if (generic) {
    body.launch = {
      mode: $("setgmode").value,
      program: $("setgprogram").value.trim(),
      args: $("setgargs").value.trim().split(/\s+/).filter(Boolean),
      command: $("setgcommand").value.trim(),
      workdir: $("setgworkdir").value.trim()
    };
    if ($("setgmode").value === "exec" && !body.launch.program) {
      fail(new Error(strings["web.new.program"] || "program required"));
      return;
    }
    if ($("setgmode").value !== "exec" && !body.launch.command) {
      fail(new Error(strings["web.new.command"] || "command required"));
      return;
    }
  } else {
    body.mc_version = $("setmcver").value.trim();
    body.jar = $("setjar").value.trim() || "server.jar";
    body.min_mem = $("setminmem").value.trim() || "1G";
    body.max_mem = $("setmaxmem").value.trim() || "4G";
    body.extra_jvm_args = $("setjvm").value.trim().split(/\s+/).filter(Boolean);
    body.extra_server_args = $("setsrv").value.trim().split(/\s+/).filter(Boolean);
  }

  try {
    const data = await apiOk("/api/instances/settings", body);
    toast(data.message || strings["web.settings.saved"] || "");
    closeSettings();
    await refresh();
  } catch (err) {
    fail(err);
  }
}

/* ---------------------------------------------------------------- frp 面板 */

function frpToggleTypeFields() {
  const ptype = $("frptype").value;
  const needsPort = ptype === "tcp" || ptype === "udp";
  $("frp-remote-wrap").hidden = !needsPort;
  $("frp-domain-wrap").hidden = needsPort;
}

let frpManual = { url: "", asset: "", binName: "frpc" };

function renderFrpManual() {
  const hint = fmt(strings["web.frp.manual_hint"] || "{asset}",
                   { asset: frpManual.asset || "", bin: frpManual.binName || "" });
  $("frp-manual-hint").textContent = hint;
  $("frpreleases").disabled = !frpManual.url;
}

function renderFrp(data) {
  const status = data.status || {};
  const settings = data.settings || {};
  if (data.manual) {
    frpManual = data.manual;
    renderFrpManual();
  }
  const runText = status.running ? (strings["web.frp.running"] || "running")
                                 : (strings["web.frp.stopped"] || "stopped");
  const binText = status.binary ? (strings["web.frp.binary_ok"] || "ready")
                                : (strings["web.frp.binary_missing"] || "missing");
  $("frpstatus").textContent = (strings["web.frp.status"] || "Status") +
    ": " + runText + " · " + binText;
  $("frpstart").disabled = !!status.running;
  $("frpstop").disabled = !status.running;

  // 正在输入时不要用服务端值把输入框冲掉
  if (document.activeElement !== $("frpaddr")) $("frpaddr").value = settings.serverAddr || "";
  if (document.activeElement !== $("frpport")) $("frpport").value = String(settings.serverPort || 7000);
  if (document.activeElement !== $("frptoken")) $("frptoken").value = settings.token || "";

  const box = $("frpproxies");
  box.innerHTML = "";
  const proxies = data.proxies || [];
  if (!proxies.length) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = strings["web.frp.no_proxies"] || "";
    box.appendChild(empty);
    return;
  }
  const table = document.createElement("table");
  table.className = "flist";
  const head = document.createElement("thead");
  const hr = document.createElement("tr");
  [strings["web.frp.proxy_name"], strings["web.frp.proxy_type"],
   strings["web.frp.local_ip"], strings["web.frp.local_port"],
   strings["web.frp.remote_port"], ""].forEach((label) => {
    const th = document.createElement("th");
    th.textContent = label || "";
    hr.appendChild(th);
  });
  head.appendChild(hr);
  table.appendChild(head);
  const tbody = document.createElement("tbody");
  proxies.forEach((p) => {
    const tr = document.createElement("tr");
    const cells = [
      p.name, p.type, p.localIP, String(p.localPort || ""),
      p.remotePort ? String(p.remotePort) : (p.customDomains || []).join(", ")
    ];
    cells.forEach((text) => {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    });
    const opsTd = document.createElement("td");
    const ops = document.createElement("div");
    ops.className = "fops";
    ops.appendChild(opButton("✕", strings["web.frp.remove"],
      () => frpRemoveProxy(p.index, p.name)));
    opsTd.appendChild(ops);
    tr.appendChild(opsTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
}

async function loadFrp() {
  try {
    renderFrp(await apiOk("/api/frp"));
  } catch (err) {
    fail(err);
  }
}

function openFrp() {
  $("frpmodal").hidden = false;
  frpToggleTypeFields();
  loadFrp();
}

function closeFrp() {
  $("frpmodal").hidden = true;
}

async function frpSave() {
  try {
    const data = await apiOk("/api/frp/settings", {
      serverAddr: $("frpaddr").value.trim(),
      serverPort: parseInt($("frpport").value, 10) || 7000,
      token: $("frptoken").value.trim()
    });
    toast(data.message || "");
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpStart() {
  try {
    const data = await apiOk("/api/frp/start", {});
    toast(data.message || "");
    renderFrp({ status: data.status, settings: {}, proxies: [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpStop() {
  try {
    const data = await apiOk("/api/frp/stop", {});
    toast(data.message || "");
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpDownload() {
  toast(strings["web.frp.downloading"] || "");
  try {
    const data = await apiOk("/api/frp/download", {});
    toast(data.message || "");
  } catch (err) {
    // 下载不通时告诉用户去哪手动拿，并把上传入口亮出来
    fail(err);
    renderFrpManual();
  }
  loadFrp();
}

async function frpUpload(file) {
  if (!file) return;
  const label = (strings["web.frp.uploading"] || "Uploading…") + " " + file.name;
  try {
    // 直接把 File 当请求体发；压缩包和裸二进制都收
    const data = await withProgress(label, (report) => uploadWithProgress(
      "/api/frp/upload", file, report));
    toast(data.message || "");
  } catch (err) {
    fail(err);
  }
  loadFrp();
}

async function frpAddProxy() {
  const ptype = $("frptype").value;
  const body = {
    name: $("frpname").value.trim(),
    type: ptype,
    localIP: $("frplocalip").value.trim() || "127.0.0.1",
    localPort: parseInt($("frplocalport").value, 10) || 0
  };
  if (ptype === "tcp" || ptype === "udp") {
    body.remotePort = parseInt($("frpremoteport").value, 10) || 0;
  } else {
    body.customDomains = $("frpdomains").value.trim();
  }
  try {
    const data = await apiOk("/api/frp/proxy", body);
    $("frpname").value = "";
    $("frplocalport").value = "";
    $("frpremoteport").value = "";
    $("frpdomains").value = "";
    renderFrp({ status: { running: !$("frpstop").disabled, binary: true },
                settings: {}, proxies: data.proxies || [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpRemoveProxy(index, name) {
  const ask = fmt(strings["web.frp.confirm_remove"] || "Remove {name}?", { name: name });
  if (!window.confirm(ask)) return;
  try {
    const data = await apiOk("/api/frp/proxy/delete", { index: index });
    renderFrp({ status: { running: !$("frpstop").disabled, binary: true },
                settings: {}, proxies: data.proxies || [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

/* ---------------------------------------------------------------- 绑定 */

$("send").onclick = () => sendCommand(null);
$("cmd").addEventListener("keydown", (ev) => { if (ev.key === "Enter") sendCommand(null); });
$("refresh").onclick = () => refresh().catch(() => {});
$("clear").onclick = clearLog;
$("follow").onclick = () => setFollow(!follow);
$("jump").onclick = () => setFollow(true);

$("tab-console").onclick = () => switchTab("console");
$("tab-files").onclick = () => switchTab("files");

$("fup").onclick = () => { if (filesPath) loadFiles(filesParent); };
$("froot").onclick = () => loadFiles("");
$("frefresh").onclick = () => loadFiles();
$("fnewfile").onclick = () => newEntry(false);
$("fnewdir").onclick = () => newEntry(true);
$("fupload").onclick = () => $("fupload-input").click();
$("fupload-input").onchange = (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  uploadFile(file);
};
$("fuploaddir").onclick = () => $("fupload-dir-input").click();
$("fupload-dir-input").onchange = (ev) => {
  const list = Array.prototype.slice.call(ev.target.files || []);
  ev.target.value = "";
  uploadFolder(list);
};
$("esave").onclick = saveEditor;
$("ecancel").onclick = closeEditor;

$("newinst").onclick = openNewInstance;
$("dclose").onclick = closeNewInstance;
$("ntab-core").onclick = () => newTab("core");
$("ntab-jar").onclick = () => newTab("jar");
$("ntab-import").onclick = () => newTab("import");
$("ntab-generic").onclick = () => newTab("generic");
$("ni-core").onchange = loadCoreVersions;
$("ni-create").onclick = createWithCore;
$("ni-blank").onclick = createBlank;
$("ni-jar-create").onclick = createWithJar;
$("ni-scan").onclick = scanArchive;
$("ni-import").onclick = commitImport;
$("ni-gmode").onchange = genericModeToggle;
$("ni-gcreate").onclick = createGeneric;

$("instset").onclick = openSettings;
$("setclose").onclick = closeSettings;
$("setgmode").onchange = setModeToggle;
$("setsave").onclick = saveSettings;

$("frpbtn").onclick = openFrp;
$("frpclose").onclick = closeFrp;
$("frpsave").onclick = frpSave;
$("frpstart").onclick = frpStart;
$("frpstop").onclick = frpStop;
$("frpdownload").onclick = frpDownload;
$("frptype").onchange = frpToggleTypeFields;
$("frpadd").onclick = frpAddProxy;
$("frpreleases").onclick = () => {
  if (frpManual.url) window.open(frpManual.url, "_blank", "noopener");
};
$("frpupload").onclick = () => $("frpfile").click();
$("frpfile").onchange = (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  frpUpload(file);
};

// 点遮罩空白处关掉对话框；Esc 关掉最上层那个
$("modal").addEventListener("click", (ev) => {
  if (ev.target === $("modal")) closeNewInstance();
});
$("setmodal").addEventListener("click", (ev) => {
  if (ev.target === $("setmodal")) closeSettings();
});
$("frpmodal").addEventListener("click", (ev) => {
  if (ev.target === $("frpmodal")) closeFrp();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (!$("editor").hidden) closeEditor();
  else if (!$("frpmodal").hidden) closeFrp();
  else if (!$("setmodal").hidden) closeSettings();
  else if (!$("modal").hidden) closeNewInstance();
});

buildChips();

try {
  const saved = localStorage.getItem("mstl.selected");
  if (saved) selected = saved;
} catch (e) {}

refresh().then(connect).catch(() => { connect(); });
setInterval(() => refresh().catch(() => {}), 15000);
</script>
