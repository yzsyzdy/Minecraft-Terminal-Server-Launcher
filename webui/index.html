<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSTL</title>
<script>
/* 主题要在首次绘制前定下来，否则深色会先闪一下白。
   三种取值存在 localStorage：auto（跟系统）/ dark / light。 */
(function () {
  try {
    var mode = localStorage.getItem("mstl.theme") || "auto";
    var dark = mode === "dark" || (mode === "auto" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<style>
  /* ======================================================================
     MSTL 网页面板 — 视觉规范
     ----------------------------------------------------------------------
     和 Wiki（docs/stylesheets/extra.css）共用一套语言：暖纸底色 + 一个品牌
     蓝 + 等宽字体做标注。三条纪律，改之前先读：

       1. 层次先靠间距和字号，再靠颜色，最后才靠线。
       2. 品牌蓝只出现在「主按钮、当前项、焦点、链接」四处，不当装饰。
       3. 浮在文档之上的东西（对话框、toast、进度条）才有投影，
          其余面与面之间用 1px 线或底色差来分。

     内容分级（这套面板只有三个层级）：
       主   —— 控制台输出、当前服务器名
       次   —— 左侧实例列表、运行状态、启动 / 停止
       三   —— 详情 chips、标签页、文件工具条、AI 元信息
     每个视图只有一个主操作：发送指令 / 保存文件 / 发送给 AI。
     ====================================================================== */

  :root{
    color-scheme:light;

    /* 底色：纸面是暖白，不是纯白 */
    --bg:#f7f5f0; --surface:#ffffff; --sunken:#f2efe9; --hover:#f2efe9;
    --line:#e4e2dc; --line-strong:#cfccc4;

    /* 文字三档。弱色只给图标、占位和分隔线，不给正文 */
    --fg:#1f2430; --dim:#5a626e; --faint:#8a919c;

    /* 品牌：一个色相。fill 用于实心块，text 用于文字和描边 */
    --brand:#4c5bd4; --brand-ink:#3b47b4; --brand-text:#4c5bd4;
    --brand-soft:rgba(76,91,212,.10); --select:rgba(76,91,212,.22);

    --ok:#1a7f37; --ok-soft:rgba(26,127,55,.10);
    --warn:#8a5a00; --warn-soft:rgba(154,103,0,.10);
    --err:#cf222e; --err-soft:rgba(207,34,46,.08);

    /* 浮层提示：深底白字，和页面反着来 */
    --toast-bg:#1f2430; --toast-fg:#ffffff;
    --toast-err-bg:#cf222e; --toast-err-fg:#ffffff;

    /* 间距：4 的倍数，别在这几档之外取值 */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

    /* 圆角三档 */
    --r-sm:4px; --r:6px; --r-lg:10px;

    /* 字号：11 标注 / 12 次文 / 13 正文 / 15 标题 */
    --t-label:11px; --t-meta:12px; --t-ui:13px; --t-title:15px;

    --font:"Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;

    --shadow-float:0 1px 2px rgba(31,36,48,.05),0 10px 28px rgba(31,36,48,.10);
  }

  /* 深色：宣传片里的「舞台」，暖黑不是纯黑。底色、线、文字直接取 Wiki 的
     slate 那套值，只把品牌色抬亮一档——#4c5bd4 压在深底上会糊成一团。
     由 <head> 里的小脚本先写 data-theme，所以这里只需要一个选择器。 */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b0a09; --surface:#15130f; --sunken:#100e0c; --hover:#1f1b16;
    --line:#2a2620; --line-strong:#3a352d;
    --fg:#f4f0e8; --dim:#a9a399; --faint:#7d786f;
    --brand:#5b68e6; --brand-ink:#4a56d2; --brand-text:#a3adf7;
    --brand-soft:rgba(122,136,245,.16); --select:rgba(163,173,247,.24);
    --ok:#3fb950; --ok-soft:rgba(63,185,80,.14);
    --warn:#d29922; --warn-soft:rgba(210,153,34,.14);
    --err:#f85149; --err-soft:rgba(248,81,73,.12);
    --toast-bg:#2a2620; --toast-fg:#f4f0e8;
    --toast-err-bg:#8c1f28; --toast-err-fg:#ffffff;
    --shadow-float:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  /* 作者样式优先于浏览器默认样式，所以下面那些 display:flex 会把 UA 的
     [hidden]{display:none} 顶掉——被隐藏的面板反而一直看得见。这条兜住它。 */
  [hidden]{display:none !important}
  html,body{height:100%}
  /* 移动端地址栏会吃掉视口高度，能用 dvh 就用 dvh */
  @supports (height:100dvh){html,body{height:100dvh}}
  body{margin:0;color:var(--fg);background:var(--bg);
       font:var(--t-ui)/1.55 var(--font);
       -webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column}
  ::selection{background:var(--select)}
  *{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);
                            border:3px solid transparent;border-radius:8px;
                            background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  .sp{flex:1}

  /* ------------------------------------------------------------------ 顶栏 */
  header{flex:0 0 auto;height:48px;padding:0 var(--s4);
         display:flex;align-items:center;gap:var(--s2);
         background:var(--surface);border-bottom:1px solid var(--line)}
  header b{font:700 var(--t-ui)/1 var(--mono);letter-spacing:.09em;
           color:var(--fg);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
  /* frp 是面板级入口，不是主操作：和旁边的图标按钮同一个语气 */
  #frpbtn{border-color:transparent;background:transparent;color:var(--dim);
          padding:0 8px;text-transform:uppercase;letter-spacing:.08em;
          font:400 var(--t-label)/1 var(--mono)}
  #frpbtn:hover:not(:disabled){background:var(--sunken);
          border-color:transparent;color:var(--fg)}

  .dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;
       background:var(--faint);transition:background .2s,box-shadow .2s}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
  .dot.connecting{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
  .dot.offline{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}

  /* ------------------------------------------------------------ 按钮三档 */
  button{display:inline-flex;align-items:center;justify-content:center;gap:6px;
         height:28px;padding:0 10px;border-radius:var(--r);
         border:1px solid var(--line-strong);background:var(--surface);
         color:var(--fg);font:500 var(--t-meta)/1 var(--font);
         white-space:nowrap;cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--hover);border-color:var(--faint)}
  button:active:not(:disabled){background:var(--line)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}

  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover:not(:disabled){background:var(--brand-ink);
                                       border-color:var(--brand-ink);color:#fff}

  /* 图标按钮：平时不占视觉重量，悬停才浮出来 */
  button.ghost{border-color:transparent;background:transparent;
               color:var(--dim);width:28px;padding:0;font-size:13px}
  button.ghost:hover:not(:disabled){background:var(--hover);color:var(--fg);
                                    border-color:transparent}

  /* 工具条上的文字动作：不画框，只靠悬停底色提示可点。
     一屏里的框越少，主按钮才越显眼。 */
  #head > #clear,#head > #follow,
  #fbar > button:not(.ghost),
  #aihead > button:not(.ghost){border-color:transparent;background:transparent;
                               color:var(--dim);padding:0 9px}
  #head > #clear:hover:not(:disabled),#head > #follow:hover:not(:disabled),
  #fbar > button:not(.ghost):hover:not(:disabled),
  #aihead > button:not(.ghost):hover:not(:disabled){background:var(--hover);
                               border-color:transparent;color:var(--fg)}

  /* -------------------------------------------------------------- 主体布局 */
  main{flex:1;min-height:0;display:grid;grid-template-columns:296px 1fr}

  /* ---------------------------------------------------------- 实例列表 */
  #list{overflow:auto;background:var(--bg);border-right:1px solid var(--line)}
  .empty{margin:var(--s3);padding:var(--s5) var(--s4);max-width:34ch;
         border:1px dashed var(--line-strong);border-radius:var(--r-lg);
         color:var(--dim);font-size:var(--t-meta);line-height:1.8}
  .item{padding:var(--s3) var(--s4) var(--s3) 14px;cursor:pointer;
        border-left:2px solid transparent;border-bottom:1px solid var(--line);
        transition:background .12s,border-color .12s}
  .item:hover{background:var(--surface)}
  .item.sel{background:var(--surface);border-left-color:var(--brand)}
  .row{display:flex;align-items:baseline;justify-content:space-between;
       gap:var(--s2)}
  .name{min-width:0;font-size:var(--t-ui);font-weight:600;letter-spacing:-.01em;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{margin-top:3px;font:400 var(--t-label)/1.6 var(--mono);letter-spacing:.01em;
        color:var(--dim);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item > .row:last-child{justify-content:flex-start;gap:6px}
  .item > .row:last-child button{height:24px;padding:0 9px;
        border-color:var(--line-strong);background:transparent;
        color:var(--dim);font-size:var(--t-label)}
  .item > .row:last-child button:hover:not(:disabled){background:var(--hover);
        border-color:var(--faint);color:var(--fg)}
  .item > .row:last-child button.primary,
  .item > .row:last-child button.primary:hover:not(:disabled){background:var(--brand);
        border-color:var(--brand);color:#fff}

  /* 状态标签：一个点一段字，颜色只表示状态，不装饰 */
  .badge{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
         height:19px;padding:0 6px 0 5px;border-radius:var(--r-sm);
         background:var(--sunken);color:var(--dim);
         font:500 var(--t-label)/1 var(--mono);letter-spacing:.02em}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;
                 background:currentColor;flex:0 0 auto}
  .badge.running{background:var(--ok-soft);color:var(--ok)}
  .badge.stopping{background:var(--warn-soft);color:var(--warn)}

  /* -------------------------------------------------------------- 右栏头部 */
  #pane{position:relative;display:flex;flex-direction:column;
        min-width:0;background:var(--surface)}
  #head{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);
        padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
  #head .name{font-size:var(--t-title);font-weight:600;letter-spacing:-.01em}

  /* 标签页：凹槽里的分段控件，当前项是一块白 */
  .tabs,.dtabs{display:inline-flex;gap:2px;padding:2px;
               background:var(--sunken);border:1px solid var(--line);
               border-radius:var(--r)}
  .tab{height:24px;padding:0 11px;border:1px solid transparent;
       background:transparent;color:var(--dim);
       font:500 var(--t-meta)/1 var(--font);border-radius:var(--r-sm)}
  .tab:hover:not(:disabled){background:transparent;border-color:transparent;
                            color:var(--fg)}
  .tab.on{background:var(--surface);border-color:var(--line-strong);
          color:var(--fg);font-weight:600}
  #follow.on{border-color:var(--brand-text);background:var(--brand-soft);
             color:var(--brand-text)}

  /* ------------------------------------------------------------ 详情 chips */
  #details{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;
           padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
  #details:empty{display:none}
  .chip{max-width:52ch;padding:1px 7px;border-radius:var(--r-sm);
        background:var(--sunken);color:var(--dim);
        font:400 var(--t-label)/1.7 var(--mono);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip b{color:var(--fg);font-weight:600}

  /* ---------------------------------------------------------------- 控制台 */
  #log{flex:1;min-height:0;overflow:auto;margin:0;
       padding:var(--s3) var(--s4);white-space:pre-wrap;word-break:break-all;
       background:var(--sunken);color:var(--fg);
       font:400 12.5px/1.7 var(--mono)}
  #log .note{color:var(--dim)}
  #log .input{color:var(--brand-text);font-weight:600}
  #log .warn{color:var(--warn)}
  #log .error{color:var(--err)}

  #jump{position:absolute;right:var(--s5);bottom:104px;height:26px;
        padding:0 12px;border-radius:99px;
        background:var(--surface);border-color:var(--line-strong);
        color:var(--dim);font-size:var(--t-label);
        box-shadow:var(--shadow-float)}

  #bar{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--s2);
       padding:var(--s2) var(--s4) var(--s3);
       border-top:1px solid var(--line);background:var(--surface)}
  #chips{display:flex;flex-wrap:wrap;gap:6px}
  #chips button{height:24px;padding:0 10px;border-radius:99px;
                border-color:var(--line);background:transparent;
                color:var(--dim);font:400 var(--t-label)/1 var(--mono)}
  #chips button:hover:not(:disabled){background:var(--hover);
                border-color:var(--line-strong);color:var(--fg)}
  #line{display:flex;gap:var(--s2)}
  #cmd{flex:1;min-width:0;height:32px;padding:0 10px;border-radius:var(--r);
       border:1px solid var(--line-strong);background:var(--surface);
       color:var(--fg);font:400 12.5px var(--mono)}
  #cmd::placeholder{color:var(--faint);font:var(--t-meta) var(--font)}
  #cmd:focus{outline:none;border-color:var(--brand-text);
             box-shadow:0 0 0 3px var(--brand-soft)}
  #line .primary{height:32px;padding:0 16px}

  /* ---------------------------------------------------------- 文件管理器 */
  #files{flex:1;min-height:0;display:flex;flex-direction:column}
  #fbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
        padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
  #fpath{max-width:44ch;color:var(--dim);
         font:400 11.5px/1 var(--mono);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #flist{flex:1;overflow:auto}
  #flist table{width:100%;border-collapse:collapse;font-size:var(--t-meta)}
  #flist th{position:sticky;top:0;z-index:1;text-align:left;
            padding:8px 12px;background:var(--sunken);
            border-bottom:1px solid var(--line);
            font:600 10px/1 var(--mono);letter-spacing:.1em;
            text-transform:uppercase;color:var(--dim)}
  #flist td{padding:7px 12px;border-bottom:1px solid var(--line);
            vertical-align:middle}
  #flist tr:hover td{background:var(--bg)}
  #flist .fname{display:flex;align-items:center;gap:7px;
                cursor:pointer;min-width:0}
  #flist .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #flist .fico{flex:0 0 auto;width:16px;text-align:center;color:var(--faint)}
  #flist .fdir .fname{font-weight:600}
  #flist .fmeta{color:var(--dim);font:400 var(--t-label)/1 var(--mono);
                white-space:nowrap;font-variant-numeric:tabular-nums}
  #flist .fops{display:flex;gap:4px;justify-content:flex-end}
  #flist .fops button{height:24px;padding:0 8px;font-size:var(--t-label);
                      border-color:transparent;background:transparent;
                      color:var(--dim)}
  #flist .fops button:hover:not(:disabled){background:var(--hover);
                      border-color:var(--line-strong);color:var(--fg)}
  .fempty{padding:var(--s5) var(--s4);color:var(--dim);
          font-size:var(--t-meta);line-height:1.8}

  #editor{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
          background:var(--surface)}
  #ebar{display:flex;align-items:center;gap:var(--s2);
        padding:var(--s2) var(--s4);
        border-bottom:1px solid var(--line);background:var(--surface)}
  #epath{color:var(--dim);font:400 11.5px/1 var(--mono);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #etext{flex:1;min-height:0;border:0;outline:none;resize:none;
         padding:var(--s3) var(--s4);tab-size:4;
         font:400 12.5px/1.75 var(--mono);color:var(--fg);
         background:var(--surface)}

  /* ---------------------------------------------------------------- 对话框 */
  #modal,#setmodal,#frpmodal{position:fixed;inset:0;z-index:20;display:flex;
        align-items:center;justify-content:center;padding:var(--s4);
        background:rgba(31,36,48,.32)}
  .dialog{width:min(640px,100%);max-height:100%;display:flex;
          flex-direction:column;overflow:hidden;
          background:var(--surface);border:1px solid var(--line-strong);
          border-radius:var(--r-lg);box-shadow:var(--shadow-float)}
  .dhead{display:flex;align-items:center;gap:var(--s2);
         padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
  .dhead b{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .dtabs{align-self:flex-start;margin:var(--s3) var(--s4) 0;flex-wrap:wrap}
  .dbody{padding:var(--s4);overflow:auto}
  .drow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
  .drow:last-child{margin-bottom:0}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
  .field label{color:var(--dim);
               font:600 var(--t-label)/1.4 var(--mono);letter-spacing:.04em}
  .field input,.field select{height:32px;padding:0 9px;border-radius:var(--r);
        border:1px solid var(--line-strong);background:var(--surface);
        color:var(--fg);font:var(--t-ui)/1 var(--font);min-width:0}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand-text);
        box-shadow:0 0 0 3px var(--brand-soft)}
  .hint{max-width:62ch;margin-bottom:var(--s3);color:var(--dim);
        font-size:var(--t-meta);line-height:1.8}
  .dactions{display:flex;gap:var(--s2);justify-content:flex-end;
            flex-wrap:wrap;padding-top:var(--s2)}

  /* ------------------------------------------------------------ 浮层提示 */
  #toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);
         z-index:40;max-width:min(560px,92vw);padding:9px 14px;
         border-radius:var(--r);background:var(--toast-bg);color:var(--toast-fg);
         font-size:var(--t-meta);box-shadow:var(--shadow-float)}
  #toast.err{background:var(--toast-err-bg);color:var(--toast-err-fg)}

  /* 长任务进度条（下载服务端核心、下载 frpc、上传文件） */
  #job{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:38;
       display:flex;align-items:center;gap:var(--s3);
       max-width:min(600px,92vw);padding:8px 14px;
       border-radius:var(--r-lg);border:1px solid var(--line-strong);
       background:var(--surface);box-shadow:var(--shadow-float);
       font-size:var(--t-meta)}
  #jobbar{width:170px;height:4px;flex:0 0 auto;border-radius:99px;
          background:var(--sunken);overflow:hidden}
  #jobfill{height:100%;width:0;border-radius:99px;background:var(--brand);
           transition:width .15s linear}
  #joblabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #jobpct{flex:0 0 auto;color:var(--dim);
          font:400 var(--t-label)/1 var(--mono);
          font-variant-numeric:tabular-nums}

  /* --------------------------------------------------------------- AI 助手 */
  #ai{flex:1;min-height:0;display:flex;flex-direction:column}
  #aihead{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
          padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
  #aistate{padding:3px 7px;border-radius:var(--r-sm);background:var(--sunken);
           color:var(--dim);font:400 var(--t-label)/1 var(--mono)}
  #aistate.on{background:var(--ok-soft);color:var(--ok)}
  #aistate.warn{background:var(--warn-soft);color:var(--warn)}
  #aiconfig{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);
            background:var(--bg)}
  #aichat{flex:1;min-height:0;overflow:auto;padding:var(--s4);
          display:flex;flex-direction:column;gap:var(--s3)}
  .msg{max-width:min(72ch,86%);padding:9px 12px;border-radius:var(--r-lg);
       font-size:var(--t-ui);line-height:1.65;
       white-space:pre-wrap;word-break:break-word}
  .msg .who{display:block;margin-bottom:4px;text-transform:uppercase;
            letter-spacing:.12em;color:var(--dim);
            font:600 10px/1 var(--mono)}
  .msg.user{align-self:flex-end;background:var(--brand-soft);color:var(--fg);
            border-radius:var(--r-lg) var(--r-lg) var(--r-sm) var(--r-lg)}
  .msg.bot{align-self:flex-start;background:var(--bg);

<script>
const $ = (id) => document.getElementById(id);
const MAX_LINES = 2000;
const QUICK = [
  { text: "list" },
  { text: "save-all" },
  { text: "help" },
  { text: "say ", prefill: true }
];

let strings = {};
let instances = [];
let selected = null;
let stream = null;
let follow = true;
let lastAtBottom = true;

// 按实例缓存控制台输出。服务端只在 SSE 建连时重放一次历史，而连接建立时
// 用户往往还没选中任何实例——原来这些行会因为 instance !== selected 被直接
// 丢掉，之后选中实例只看到一片空白，要等下一行新输出才「活」过来。
let buffers = {};
// 每个实例已画到的事件序号，用于过滤断线重连后的历史重放
let lastSeq = {};

function fmt(tpl, values) {
  return String(tpl == null ? "" : tpl).replace(/\{(\w+)\}/g, (m, k) =>
    Object.prototype.hasOwnProperty.call(values, k) ? values[k] : m);
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function baseName(path) {
  return String(path || "").split(/[\\/]/).pop();
}

// 鉴权失败后就不再自动重试了：token 不会自己变对，继续轮询只会一直报错。
let authFailed = false;

function showAuthNotice() {
  if (authFailed) return;
  authFailed = true;
  // 光说「token 无效」用户只能干瞪眼：最常见的三种原因（旧 cookie、
  // localhost 与 127.0.0.1 不通用、刚换过 token）都列出来
  const hints = ["web.auth.hint_cookie", "web.auth.hint_host",
    "web.auth.hint_regenerate"]
    .map((k) => strings[k]).filter(Boolean)
    .map((s) => "<li>" + esc(s) + "</li>").join("");
  // 以前这里是直接把 document.body.innerHTML 整个换掉。页面里所有按钮的
  // 监听都挂在 body 内的元素上，一换就等于把界面拆了：之后 applyStrings()
  // 和 refresh() 拿到的全是 null，抛出的 TypeError 又被各处 .catch(() => {})
  // 吞掉，页面彻底成死胡同，刷新也救不回来。改成盖一层遮罩，原界面留在
  // 下面，用户清掉 cookie 或换个地址重进就能继续用。
  const box = document.createElement("div");
  box.id = "auth-notice";
  box.style.cssText = "position:fixed;inset:0;z-index:9999;overflow:auto;" +
    "background:var(--surface);font:14px system-ui;color:var(--fg);padding:28px";
  box.innerHTML =
    "<h3>" + esc(strings["web.auth.invalid"] || "401") + "</h3>" +
    '<p style="color:var(--dim)">' + esc(strings["web.auth.help"] || "") + "</p>" +
    (hints ? '<ul style="color:var(--dim);line-height:1.9">' + hints + "</ul>" : "");
  document.body.appendChild(box);
}

async function readJson(res) {
  // 响应不一定是 JSON：401 时服务端回的是那张 HTML 鉴权页，反向代理和
  // 网关错误页也不是 JSON。原来直接 res.json()，用户看到的是
  // "SyntaxError: Unexpected token '<'" —— 一个和真正原因毫无关系的报错。
  if (res.status === 401) {
    showAuthNotice();
    throw new Error(strings["web.auth.invalid"] || "unauthorized");
  }
  let text = "";
  try {
    text = await res.text();
  } catch (e) {
    text = "";
  }
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error("HTTP " + res.status + ": " + text.slice(0, 120));
  }
}

async function api(path, body) {
  const options = { method: body ? "POST" : "GET", headers: {} };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  return readJson(await fetch(path, options));
}

/* ---------------------------------------------------------------- 连接状态 */

function setConn(state) {
  const dot = $("conn");
  dot.className = "dot " + state;
  dot.title = strings["web.conn." + (state === "online" ? "online"
    : state === "connecting" ? "connecting" : "offline")] || state;
}

function connect() {
  if (stream) stream.close();
  setConn("connecting");
  // 不带 name：一条流同时盯住所有实例
  stream = new EventSource("/api/stream");
  stream.onopen = () => setConn("online");
  stream.onerror = () => {
    // EventSource 会自己重连：只有它彻底放弃了，才值得显示成断开
    setConn(stream && stream.readyState === 2 ? "offline" : "connecting");
  };
  stream.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    setConn("online");
    handle(event);
  };
}

function alreadySeen(event) {
  // 每条事件都带实例内单调递增的 seq。EventSource 断线重连时服务端会把
  // 历史整段重放一遍，靠它把画过的行筛掉，否则日志里会出现成片重复。
  const name = event.instance;
  const seq = typeof event.seq === "number" ? event.seq : null;
  if (seq === null) return false;
  if (lastSeq[name] !== undefined && seq <= lastSeq[name]) return true;
  lastSeq[name] = seq;
  return false;
}

function bufferLine(event) {
  if (event.type !== "line") return null;
  const cls = event.kind === "note" ? "note"
            : event.kind === "input" ? "input"
            : lineClass(event.text);
  const text = event.kind === "input" ? "> " + (event.text || "") : (event.text || "");
  const name = event.instance;
  const buf = buffers[name] || (buffers[name] = []);
  const entry = { cls, text };
  buf.push(entry);
  if (buf.length > MAX_LINES) buf.splice(0, buf.length - MAX_LINES);
  return entry;
}

function handle(event) {
  if (alreadySeen(event)) return;
  if (event.type === "job") {
    showJob(event);
    return;
  }
  if (event.type === "state") {
    const item = instances.find(x => x.name === event.instance);
    if (item) {
      item.state = event.state;
      item.exit_code = event.exit_code;
      item.pid = event.pid;
    }
    render();
    renderDetails();
    return;
  }
  const entry = bufferLine(event);
  if (entry && event.instance === selected) appendLine(entry.cls, entry.text);
}

// refresh() 的在途序号。它会被 15 秒定时器、点实例、点启动/停止同时调用，

// 最新的就直接丢掉。

  const mine = ++refreshSeq;
  const data = await api("/api/state");
  if (mine !== refreshSeq) return;
  if (data.strings) strings = data.strings;
  instances = data.instances || [];
  if (selected && !instances.some(x => x.name === selected)) selected = null;
  applyStrings();
  render();
  renderDetails();
}

function stateLabel(state) {
  return strings["web.state." + state] || state;
}

function render() {
  const box = $("list");
  box.innerHTML = "";
  if (!instances.length) {
    box.innerHTML = '<div class="empty">' + esc(strings["web.panel.no_instances"] || "") + "</div>";
  }
  instances.forEach(item => {
    const state = item.state || "stopped";
    const generic = (item.kind || "minecraft") === "generic";
    const sub = generic
      ? (strings["web.new.tab_generic"] || "generic")
      : (item.mc_version || "?") + " · " + (item.jar || "?");
    const el = document.createElement("div");
    el.className = "item" + (item.name === selected ? " sel" : "");
    el.innerHTML =
      '<div class="row"><span class="name">' + esc(item.name) + "</span>" +
      '<span class="badge ' + esc(state) + '">' + esc(stateLabel(state)) + "</span></div>" +
      '<div class="meta">' + esc(sub) + "</div>" +
      '<div class="row" style="margin-top:8px">' +
      '<button data-act="start"' + (state !== "stopped" ? " disabled" : "") + ">" +
      esc(strings["web.panel.start"] || "Start") + "</button>" +
      '<button data-act="stop"' + (state !== "running" ? " disabled" : "") + ">" +
      esc(strings["web.panel.stop"] || "Stop") + "</button></div>";

    el.onclick = (ev) => {
      const act = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-act");
      if (act === "start") {
        // 顺便把它选上，否则点了启动却在右边控制台里看不到任何反应
        select(item.name);
        api("/api/start", { name: item.name }).then(refresh).catch(() => {});
      } else if (act === "stop") {
        api("/api/stop", { name: item.name }).then(refresh).catch(() => {});
      } else {
        select(item.name);
      }
    };
    box.appendChild(el);
  });

  const cur = instances.find(x => x.name === selected);
  const st = cur ? (cur.state || "stopped") : "";
  $("cur").textContent = cur ? cur.name : "";
  $("curstate").textContent = cur ? stateLabel(st) : "";
  $("curstate").className = "badge " + st;
  $("instset").disabled = !cur;
}

/* ---------------------------------------------------------------- 详情条 */

function renderDetails() {
  const box = $("details");
  const item = instances.find(x => x.name === selected);
  box.innerHTML = "";
  if (!item) return;

  const chips = [];
  const generic = (item.kind || "minecraft") === "generic";
  // 通用实例没有内存与 Java 的概念，别摆一排空占位
  if (!generic && (item.min_mem || item.max_mem)) {
    chips.push({ text: fmt(strings["web.detail.memory"], { min: item.min_mem || "?", max: item.max_mem || "?" }) });
  }
  if (item.state === "running" && item.pid) {
    chips.push({ text: fmt(strings["web.detail.pid"], { pid: item.pid }) });
  } else if (item.exit_code !== null && item.exit_code !== undefined) {
    chips.push({ text: fmt(strings["web.detail.exit_code"], { code: item.exit_code }) });
  }
  if (generic) {
    const launch = item.launch || {};
    const modeLabel = { exec: strings["web.new.launch_exec"],
                        cmd: strings["web.new.launch_cmd"],
                        powershell: strings["web.new.launch_powershell"] }[launch.mode || "exec"]
                      || (launch.mode || "exec");
    chips.push({ text: strings["web.new.tab_generic"] + ": " + modeLabel });
    const target = (launch.mode || "exec") === "exec"
      ? (launch.program || "") : (launch.command || "");
    if (target) chips.push({ text: target, title: target });
  } else if (item.java) {
    chips.push({ text: "Java " + baseName(item.java), title: item.java });
  }
  if (item.workdir) {
    chips.push({ text: fmt(strings["web.detail.workdir"], { path: item.workdir }), title: item.workdir });
  }
  if (item.command && item.command.length) {
    chips.push({ text: (strings["web.detail.command"] || "command") + ": " + item.command.join(" "),
                 title: item.command.join(" ") });
  }

  chips.forEach(c => {
    const el = document.createElement("span");
    el.className = "chip";
    el.textContent = c.text;
    if (c.title) el.title = c.title;
    box.appendChild(el);
  });
}

/* ---------------------------------------------------------------- 控制台 */

function lineClass(text) {
  if (/\b(ERROR|SEVERE|FATAL)\b/.test(text) || /Exception|\bat [\w.$]+\([\w.]+\.java:\d+\)/.test(text)) {
    return "error";
  }
  if (/\bWARN(ING)?\b/.test(text)) return "warn";
  return "";
}

function appendLine(cls, text) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  const log = $("log");
  log.appendChild(el);
  while (log.childElementCount > MAX_LINES) log.removeChild(log.firstChild);
  if (follow) log.scrollTop = log.scrollHeight;
}

function renderLog() {
  const log = $("log");
  const entries = buffers[selected] || [];
  const frag = document.createDocumentFragment();
  entries.forEach(entry => {
    const el = document.createElement("div");
    if (entry.cls) el.className = entry.cls;
    el.textContent = entry.text;
    frag.appendChild(el);
  });
  log.innerHTML = "";
  log.appendChild(frag);
  log.scrollTop = log.scrollHeight;
  $("jump").hidden = true;
}

function clearLog() {
  buffers[selected] = [];
  $("log").innerHTML = "";
  $("jump").hidden = true;
  lastAtBottom = true;
}

function setFollow(value) {
  follow = value;
  applyStrings();
  if (follow) {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
    $("jump").hidden = true;
  }
}

$("log").addEventListener("scroll", () => {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
  lastAtBottom = atBottom;
  if (!atBottom && follow) {
    follow = false;
    applyStrings();
  }
  $("jump").hidden = atBottom;
  if (atBottom && !follow) {
    // 用户自己滚到底了，把跟随接回来
    follow = true;
    applyStrings();
  }
});

/* ---------------------------------------------------------------- 选择 */

function select(name) {
  selected = name;
  try { localStorage.setItem("mstl.selected", name || ""); } catch (e) {}
  // 历史行一直存在本地缓冲里，这里直接整段画出来，不必重连那条全局流
  renderLog();
  render();
  renderDetails();
  // 文件管理器是按实例的，换实例就得回到根目录重新列
  if (tab === "files") loadFiles("");
}

let toastTimer = null;

function toast(message, isError) {
  const el = $("toast");
  el.textContent = message || "";
  el.className = isError ? "err" : "";
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 6000 : 2600);
}

function fail(err) {
  toast((err && err.message) ? err.message : String(err), true);
}

/* 长任务进度条：下载/上传的进度从服务端的 SSE 来，或者由 XHR 自己报。 */
let jobHideTimer = null;

function showJob(event) {
  const ratio = typeof event.ratio === "number" ? event.ratio : 0;
  $("joblabel").textContent = event.label || "";
  $("jobfill").style.width = Math.round(ratio * 100) + "%";
  $("jobpct").textContent = Math.round(ratio * 100) + "%";
  $("job").hidden = false;
  if (jobHideTimer) clearTimeout(jobHideTimer);
  if (event.done) {
    jobHideTimer = setTimeout(() => { $("job").hidden = true; }, 700);
  }
}

/* 包一层：任务开始时把进度条摆出来，无论成败最后都收掉 */
async function withProgress(label, task) {
  showJob({ label: label, ratio: 0 });
  try {
    return await task((ratio) => showJob({ label: label, ratio: ratio }));
  } finally {
    showJob({ label: label, ratio: 1, done: true });
  }
}

/* fetch() 报不了上传进度，上传统一走 XHR */
function uploadWithProgress(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && data.ok !== false) resolve(data);
      else reject(new Error(data.message || ("HTTP " + xhr.status)));
    };
    xhr.onerror = () => reject(new Error("network error"));
    xhr.send(file);
  });
}

/* api() 只负责取回 JSON；业务失败由 core 以 {ok:false,message} 表达，
   这里统一转成异常，调用方一个 catch 就能兜住所有情况。 */
async function apiOk(path, body) {
  const data = await api(path, body);
  if (data && data.ok === false) throw new Error(data.message || "error");
  return data;
}

  // 控制台那一列（日志 + 输入条 + 底部按钮）在文件和 AI 下都要让位
  const hideConsole = isFiles || isAi;
  $("log").hidden = hideConsole;
  $("bar").hidden = hideConsole;
  $("clear").hidden = hideConsole;
  $("follow").hidden = hideConsole;
  $("jump").hidden = true;

/* ------------------------------------------------------------------ AI 助手 */

// 模型说的话是不可信文本：服主装的插件能往日志里写任何东西，而日志会被喂给
// 模型，模型再把它复述回来。所以这里一律用 textContent 建节点，绝不把模型
// 的输出塞进 innerHTML —— 面板里的其它地方可以用 esc() + innerHTML，但对话流
// 是唯一一处由外部内容驱动的，走 DOM 更省心。
let aiState = null;
let aiConfigOpen = false;
let aiLoading = false;

function aiNode(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = String(text);
  return node;
}

function aiShow() {
  aiReload().catch(aiError);
}

async function aiReload() {
  if (aiLoading) return;
  aiLoading = true;
  try {
    aiRender(await apiOk("/api/ai"));
  } catch (err) {
    aiError(err);
  } finally {
    aiLoading = false;
  }
}

function aiError(err) {
  const box = $("aichat");
  if (!box) return;
  box.appendChild(aiNode("div", "msg err", (err && err.message) || String(err)));
  box.scrollTop = box.scrollHeight;
}

function aiSetState(text, cls) {
  const node = $("aistate");
  node.textContent = text || "";
  node.className = cls || "";
}

function aiDisabled() {
  return !aiState || !aiState.enabled || !aiState.configured;
}

function aiBusy(on) {
  $("aisend").disabled = on || aiDisabled();
  $("aiinput").disabled = on;
  if (on) aiSetState(strings["web.ai.thinking"] || "", "warn");
}

function aiRenderChat(list) {
  const box = $("aichat");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = "";
  if (!list.length) {
    box.appendChild(aiNode("div", "msg sys",
      strings["web.ai.empty"] || ""));
  }
  list.forEach((item) => {
    const role = String(item.role || "");
    if (role === "user") {
      const node = aiNode("div", "msg user", item.text);
      node.insertBefore(aiNode("span", "who", strings["web.ai.you"] || "you"), node.firstChild);
      box.appendChild(node);
    } else if (role === "assistant") {
      const node = aiNode("div", "msg bot", item.text);
      node.insertBefore(aiNode("span", "who", strings["web.ai.assistant"] || "MSTL"), node.firstChild);
      box.appendChild(node);
    } else if (role === "tool") {
      const node = aiNode("div", "msg tool");
      const head = aiNode("span", "who", item.tool || "tool");
      if (item.risk === "confirm") head.textContent += " · " + (strings["web.ai.pending_title"] || "");
      node.appendChild(head);
      node.appendChild(document.createTextNode(String(item.text || "")));
      box.appendChild(node);
    } else if (role === "system") {
      box.appendChild(aiNode("div", "msg sys", item.text));
    }
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function aiRenderPending(list) {
  const box = $("aipending");
  box.innerHTML = "";
  box.hidden = !(list && list.length);
  (list || []).forEach((item) => {
    const card = aiNode("div", "pending");
    card.appendChild(aiNode("div", "ptitle", strings["web.ai.pending_title"] || ""));
    card.appendChild(aiNode("div", "psum", item.summary));
    const secs = Math.max(0, Math.round(Number(item.expires_in) || 0));
    card.appendChild(aiNode("div", "pmeta",
      fmt(strings["web.ai.expires"] || "{seconds}s", { seconds: secs })));
    const acts = aiNode("div", "pacts");
    const ok = aiNode("button", "primary", strings["web.ai.confirm"] || "OK");
    ok.onclick = () => aiConfirm(item.id, true);
    const no = aiNode("button", null, strings["web.ai.cancel"] || "Cancel");
    no.onclick = () => aiConfirm(item.id, false);
    acts.appendChild(ok);
    acts.appendChild(no);
    card.appendChild(acts);
    box.appendChild(card);
  });
}

function aiRender(st) {
  aiState = st;
  $("tab-ai").textContent = strings["web.ai.tab"] || "AI";
  $("aititle").textContent = strings["web.ai.tab"] || "AI";
  $("aireset").textContent = strings["web.ai.reset"] || "";
  $("aiset").title = strings["web.settings.ai"] || "AI";

  if (st.busy) {
    aiSetState(strings["web.ai.thinking"] || "", "warn");
  } else if (!st.enabled) {
    aiSetState(strings["web.ai.hint_disabled"] || "", "warn");
  } else if (!st.configured) {
    aiSetState(strings["web.ai.need_config"] || "", "warn");
  } else {
    aiSetState(st.model || "", "on");
  }

  // 设置区：没配好就自动展开，配好了就收起来（用户点齿轮还能再打开）
  if (!st.enabled || !st.configured) aiConfigOpen = true;
  $("aiconfig").hidden = !aiConfigOpen;
  $("aienabled").checked = !!st.enabled;
  if (document.activeElement !== $("aibase")) $("aibase").value = st.base_url || "";
  if (document.activeElement !== $("aimodel")) $("aimodel").value = st.model || "";
  $("aikey").placeholder = st.key_from_env
    ? (strings["web.settings.ai_key_env"] || "")
    : st.key_set ? (strings["web.settings.ai_key_set"] || "") : "";
  if (st.key_from_env) $("aikey").disabled = true;

  aiRenderChat(st.transcript || []);
  aiRenderPending(st.pending || []);
  aiBusy(false);
}

async function aiSend() {
  const input = $("aiinput");
  const text = input.value.trim();
  if (!text || aiDisabled() || (aiState && aiState.busy)) return;
  input.value = "";
  aiBusy(true);
  try {
    await apiOk("/api/ai/chat", { text: text, instance: selected || "" });
    await aiReload();
  } catch (err) {
    aiError(err);
    aiBusy(false);
  }
}

async function aiConfirm(id, approve) {
  aiBusy(true);
  try {
    await apiOk("/api/ai/confirm", { id: id, approve: approve });
    await aiReload();
  } catch (err) {
    aiError(err);
    aiBusy(false);
  }
}

async function aiReset() {
  aiBusy(true);
  try {
    await apiOk("/api/ai/reset", {});
    await aiReload();
  } catch (err) {
    aiError(err);
    aiBusy(false);
  }
}

async function aiSaveConfig() {
  const body = {
    enabled: $("aienabled").checked,
    base_url: $("aibase").value.trim(),
    model: $("aimodel").value.trim()
  };
  const key = $("aikey").value.trim();
  // 空 = 不改：服务端从不回传旧 key，前端拿不到原值，发空串会把已存的清掉
  if (key) body.api_key = key;
  try {
    const data = await apiOk("/api/ai/config", body);
    $("aikey").value = "";
    aiConfigOpen = false;
    aiRender(data.ai);
    toast(data.message || strings["web.settings.ai_saved"] || "");
  } catch (err) {
    aiError(err);
  }
}


/* -------------------------------------------------------------- 文件管理器 */

let filesPath = "";
let filesParent = "";
let editorPath = null;

function joinPath(base, name) {
  return base ? base + "/" + name : name;
}

function fmtSize(bytes) {
  if (!bytes) return "";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let value = bytes;
  let i = 0;
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i += 1; }
  return (i === 0 ? String(value) : value.toFixed(1)) + " " + units[i];
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function opButton(symbol, title, handler) {
  const b = document.createElement("button");
  b.textContent = symbol;
  if (title) b.title = title;
  b.onclick = (ev) => { ev.stopPropagation(); handler(); };
  return b;
}

function renderFiles(entries, parent) {
  $("fpath").textContent = "/" + (filesPath || "");
  const box = $("flist");
  box.innerHTML = "";

  if (!selected) {
    const hint = document.createElement("div");
    hint.className = "fempty";
    hint.textContent = strings["web.panel.no_instances"] || "";
    box.appendChild(hint);
    return;
  }

  const table = document.createElement("table");
  const head = document.createElement("thead");
  const headRow = document.createElement("tr");
  [strings["web.files.name"] || "Name",
   strings["web.files.size"] || "Size",
   strings["web.files.modified"] || "Modified", ""].forEach((label) => {
    const th = document.createElement("th");
    th.textContent = label;
    headRow.appendChild(th);
  });
  head.appendChild(headRow);
  table.appendChild(head);

  const tbody = document.createElement("tbody");
  if (filesPath) {
    tbody.appendChild(buildFileRow(
      { name: "..", path: parent, dir: true, size: 0, mtime: 0, editable: false },
      true));
  }
  if (!entries.length && !filesPath) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.className = "fempty";
    td.textContent = strings["web.files.empty"] || "";
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  entries.forEach((entry) => tbody.appendChild(buildFileRow(entry, false)));
  table.appendChild(tbody);
  box.appendChild(table);
}

function buildFileRow(entry, isUp) {
  const tr = document.createElement("tr");

  const nameTd = document.createElement("td");
  const nameBox = document.createElement("div");
  nameBox.className = "fname" + (entry.dir ? " fdir" : "");
  const icon = document.createElement("span");
  icon.className = "fico";
  icon.textContent = entry.dir ? "📁" : (entry.editable ? "📄" : "📦");
  const label = document.createElement("span");
  label.textContent = entry.name;
  nameBox.appendChild(icon);
  nameBox.appendChild(label);
  nameBox.onclick = () => {
    if (entry.dir) loadFiles(entry.path);
    else if (entry.editable) openEditor(entry.path);
    else downloadFile(entry);
  };
  nameTd.appendChild(nameBox);
  tr.appendChild(nameTd);

  const sizeTd = document.createElement("td");
  sizeTd.className = "fmeta";
  sizeTd.textContent = entry.dir ? "" : fmtSize(entry.size);
  tr.appendChild(sizeTd);

  const timeTd = document.createElement("td");
  timeTd.className = "fmeta";
  timeTd.textContent = isUp ? "" : fmtTime(entry.mtime);
  tr.appendChild(timeTd);

  const opsTd = document.createElement("td");
  const ops = document.createElement("div");
  ops.className = "fops";
  if (!isUp) {
    if (!entry.dir) {
      ops.appendChild(opButton("⭳", strings["web.files.download"], () => downloadFile(entry)));
      if (entry.archive) {
        ops.appendChild(opButton("⇲", strings["web.files.extract"], () => extractEntry(entry)));
      }
      if (entry.editable) {
        ops.appendChild(opButton("✎", strings["web.files.edit"], () => openEditor(entry.path)));
      }
    }
    ops.appendChild(opButton("⇄", strings["web.files.rename"], () => renameEntry(entry)));
    ops.appendChild(opButton("✕", strings["web.files.delete"], () => deleteEntry(entry)));
  }
  opsTd.appendChild(ops);
  tr.appendChild(opsTd);
  return tr;
}

// loadFiles() 的在途序号，理由同 refresh()：点 Files 标签会同时触发
// select() 和 switchTab("files") 两次加载，旧响应后到就会把新目录的列表
// 盖掉，而且 filesPath 与实际显示的内容对不上，之后的上移/重命名/删除
// 会作用到错误的路径上。
let filesSeq = 0;

async function loadFiles(path) {
  if (path !== undefined && path !== null) filesPath = path;
  const mine = ++filesSeq;
  if (!selected) {
    filesPath = "";
    filesParent = "";
    renderFiles([], "");
    return;
  }
  try {
    const data = await apiOk("/api/files?name=" + encodeURIComponent(selected) +
                             "&path=" + encodeURIComponent(filesPath));
    if (mine !== filesSeq) return;
    filesPath = data.path || "";
    filesParent = data.parent || "";
    renderFiles(data.entries || [], filesParent);
  } catch (err) {
    if (mine !== filesSeq) return;
    fail(err);
    renderFiles([], "");
  }
}

function downloadFile(entry) {
  const a = document.createElement("a");
  a.href = "/api/file/raw?name=" + encodeURIComponent(selected) +
           "&path=" + encodeURIComponent(entry.path);
  a.download = entry.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function openEditor(path) {
  if (!selected) return;
  try {
    const data = await apiOk("/api/file?name=" + encodeURIComponent(selected) +
                             "&path=" + encodeURIComponent(path));
    editorPath = data.path;
    $("etext").value = data.text || "";
    $("epath").textContent = fmt(strings["web.files.editing"] || "{path}",
                                 { path: data.path });
    $("editor").hidden = false;
    $("etext").focus();
  } catch (err) {
    fail(err);
  }
}

function closeEditor() {
  editorPath = null;
  $("etext").value = "";
  $("editor").hidden = true;
}

async function saveEditor() {
  if (!selected || editorPath === null) return;
  try {
    await apiOk("/api/file/write",
                { name: selected, path: editorPath, content: $("etext").value });
    toast(strings["web.files.saved"] || "Saved");
    closeEditor();
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

async function newEntry(isDir) {
  if (!selected) return;
  const question = isDir ? strings["web.files.prompt_new_dir"]
                         : strings["web.files.prompt_new_file"];
  const name = (window.prompt(question || "") || "").trim();
  if (!name) return;
  const path = joinPath(filesPath, name);
  try {
    if (isDir) {
      await apiOk("/api/file/mkdir", { name: selected, path: path });
    } else {
      await apiOk("/api/file/write", { name: selected, path: path, content: "" });
    }
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

async function renameEntry(entry) {
  if (!selected) return;
  const next = (window.prompt(strings["web.files.prompt_rename"] || "", entry.name) || "").trim();
  if (!next || next === entry.name) return;
  try {
    await apiOk("/api/file/rename",
                { name: selected, path: entry.path, new_name: next });
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

async function deleteEntry(entry) {
  if (!selected) return;
  const ask = fmt(strings["web.files.confirm_delete"] || "Delete {name}?",
                  { name: entry.name });
  if (!window.confirm(ask)) return;
  try {
    await apiOk("/api/file/delete", { name: selected, path: entry.path });
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

async function uploadFile(file) {
  if (!file || !selected) return;
  const path = joinPath(filesPath, file.name);
  const label = (strings["web.files.uploading"] || "Uploading…") + " " + file.name;
  try {
    // 直接把 File 当请求体发，省掉 multipart 解析；token 走 Cookie
    await withProgress(label, (report) => uploadWithProgress(
      "/api/file/upload?name=" + encodeURIComponent(selected) +
      "&path=" + encodeURIComponent(path), file, report));
    toast(fmt(strings["web.files.upload_done"] || "{name}", { name: file.name }));
    loadFiles();
  } catch (err) {
    fail(err);
  }
}

/* 上传整个文件夹：目录选择器会把每个文件带上 webkitRelativePath，
   照它建目录即可。空目录浏览器不会报，所以建不出来（会在文档里写明）。 */
async function uploadFolder(fileList) {
  if (!fileList || !fileList.length || !selected) return;
  const items = [];
  for (let i = 0; i < fileList.length; i += 1) {
    const file = fileList[i];
    const rel = String(file.webkitRelativePath || file.name).replace(/\\/g, "/");
    items.push({ file: file, rel: rel });
  }
  const total = items.length;
  let done = 0;
  let failed = 0;
  // 进度要按「处理完的个数」算，成功失败都算：以前用 done（只数成功的），
  // 10 个文件失败 1 个时进度条就停在 90%，而标签已经写着 10/10。
  let finished = 0;
  const progressLabel = (n) => fmt(strings["web.files.uploading_folder"] || "{done}/{total}",
                                   { done: n, total: total });

  showJob({ label: progressLabel(0), ratio: 0 });
  for (let i = 0; i < items.length; i += 1) {
    const item = items[i];
    const path = joinPath(filesPath, item.rel);
    try {
      await uploadWithProgress(
        "/api/file/upload?name=" + encodeURIComponent(selected) +
        "&path=" + encodeURIComponent(path), item.file,
        (ratio) => showJob({ label: progressLabel(finished), ratio: (finished + ratio) / total }));
      done += 1;
    } catch (err) {
      failed += 1;
    }
    finished += 1;
    showJob({ label: progressLabel(finished), ratio: finished / total });
  }
  showJob({ label: progressLabel(finished), ratio: 1, done: true });

  if (failed) {
    toast(fmt(strings["web.files.folder_partial"] || "{done} ok, {failed} failed",
              { done: done, failed: failed }), true);
  } else {
    toast(fmt(strings["web.files.folder_done"] || "{count} files", { count: done }));
  }
  loadFiles();
}

/* 在线解压：解到压缩包自己所在的目录，已存在的文件跳过不覆盖 */
async function extractEntry(entry) {
  if (!selected) return;
  const ask = fmt(strings["web.files.extract_confirm"] || "Extract {name}?",
                  { name: entry.name });
  if (!window.confirm(ask)) return;
  const label = fmt(strings["web.files.extracting"] || "{name}", { name: entry.name });
  showJob({ label: label, ratio: 0 });
  try {
    // 解压是同步 POST，进度条的收尾由服务端的 job 事件负责；这里只兜底
    const data = await apiOk("/api/file/extract",
                             { name: selected, path: entry.path });
    toast(data.message || "");
    loadFiles();
  } catch (err) {
    fail(err);
  } finally {
    showJob({ label: label, ratio: 1, done: true });
  }
}

    // 先建实例（jar 名先写进配置），再把 jar 传上去
    created = await apiOk("/api/instances", Object.assign({
      name: name, jar_name: file.name, mc_version: ""
    }, memFields("ni-jarmin", "ni-jarmax")));
    const res = await fetch("/api/file/upload?name=" + encodeURIComponent(created.name) +
                            "&path=" + encodeURIComponent(file.name), {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: file
    });
    const uploaded = await readJson(res);
    if (!uploaded.ok) throw new Error(uploaded.message || "upload failed");
    await afterCreate(created);
  } catch (err) {
    fail(err);
    // 实例可能已经建好了，刷新一下让用户能看到并自己去补 jar
    if (created) {
      await refresh().catch(() => {});
      closeNewInstance();
    }
  }
}

async function scanArchive() {
  const zipPath = $("ni-zip").value.trim();
  if (!zipPath) {
    fail(new Error(strings["web.new.import_path"] || ""));
    return;
  }
  try {
    const data = await apiOk("/api/instances/import/scan", { zip_path: zipPath });
    importPlan = data;
    const select = $("ni-importjar");
    select.innerHTML = "";
    (data.candidates || []).forEach((jar) => {
      const option = document.createElement("option");
      option.value = jar;
      option.textContent = jar;
      select.appendChild(option);
    });
    if (data.auto_choice) select.value = data.auto_choice;
    $("ni-importname").value = data.suggested_name || "";
    toast(strings["web.new.import_jar"] || "");
  } catch (err) {
    fail(err);
  }
}

async function commitImport() {
  if (!importPlan) {
    await scanArchive();
    if (!importPlan) return;
  }
  toast(strings["web.new.creating"] || "");
  try {
    const data = await apiOk("/api/instances/import/commit", {
      zip_path: importPlan.zip_path,
      jar: $("ni-importjar").value,
      name: $("ni-importname").value.trim()
    });
    importPlan = null;
    await afterCreate(data);
  } catch (err) {
    fail(err);
  }
}

/* ------------------------------------------------------------ 通用实例创建 */

function genericModeToggle() {

  $("ni-gcmd").hidden = isExec;

async function createGeneric() {
  const name = $("ni-gname").value.trim();
  if (!needName(name)) return;
  const mode = $("ni-gmode").value;
  const launch = {
    mode: mode,
    program: $("ni-gprogram").value.trim(),
    args: $("ni-gargs").value.trim().split(/\s+/).filter(Boolean),
    command: $("ni-gcommand").value.trim(),
    workdir: $("ni-gworkdir").value.trim()
  };
  if (mode === "exec" && !launch.program) {
    fail(new Error(strings["web.new.program"] || "program required"));
    return;
  }
  if (mode !== "exec" && !launch.command) {
    fail(new Error(strings["web.new.command"] || "command required"));
    return;
  }
  toast(strings["web.new.creating"] || "");
  try {
    const data = await apiOk("/api/instances", { name: name, kind: "generic", launch: launch });
    await afterCreate(data);
  } catch (err) {
    fail(err);
  }
}

/* -------------------------------------------------------------- 实例设置 */

function setModeToggle() {
  const isExec = $("setgmode").value === "exec";
  $("setg-prog").hidden = !isExec;
  $("setg-cmd").hidden = isExec;
}

function openSettings() {
  const item = instances.find(x => x.name === selected);
  if (!item) return;
  const generic = (item.kind || "minecraft") === "generic";

  $("settitle").textContent = strings["web.settings.title"] || "Settings";
  $("setkind").textContent = item.name + " · " +
    (generic ? (strings["web.new.tab_generic"] || "generic")
             : "Minecraft") + " — " +
    (strings["web.settings.kind_locked"] || "");
  $("setprio").value = item.process_priority || "normal";
  $("setinstauto").checked = !!item.auto_start;
  $("setautorestart").checked = !!item.auto_restart;
  $("setrestartmax").value = String(
    typeof item.restart_max === "number" ? item.restart_max : 5);
  syncRestartMax();
  $("set-mc").hidden = generic;
  $("set-generic").hidden = !generic;

  if (generic) {
    const launch = item.launch || {};
    $("setgmode").value = launch.mode || "exec";
    $("setgprogram").value = launch.program || "";
    $("setgargs").value = (launch.args || []).join(" ");
    $("setgcommand").value = launch.command || "";
    $("setgworkdir").value = launch.workdir || "";
    setModeToggle();
  } else {
    $("setmcver").value = item.mc_version || "";
    $("setjar").value = item.jar || "";
    $("setminmem").value = item.min_mem || "1G";
    $("setmaxmem").value = item.max_mem || "4G";
    $("setjvm").value = (item.extra_jvm_args || []).join(" ");
    $("setsrv").value = (item.extra_server_args || []).join(" ");
  }

  const of = item.openfrp || {};
  $("settoken").value = of.token || "";
  $("setproxyid").value = String(of.proxy_id || 0);
  $("setautostart").checked = !!of.auto_start;

  $("setmodal").hidden = false;
}

function closeSettings() {
  $("setmodal").hidden = true;
}

/* 「最多连续重启」只在勾了自动重启时才有意义。灰掉而不是藏起来：
   藏起来会让面板在勾选前后跳一下高度，手指刚放上去的按钮就跑掉了。 */
function syncRestartMax() {
  const on = $("setautorestart").checked;
  $("setrestartmax").disabled = !on;
  $("row-restartmax").style.opacity = on ? "1" : "0.45";
}

async function saveSettings() {
  if (!selected) return;
  const item = instances.find(x => x.name === selected);
  if (!item) return;
  const generic = (item.kind || "minecraft") === "generic";

  const body = {
    name: selected,
    process_priority: $("setprio").value,
    auto_start: $("setinstauto").checked,
    auto_restart: $("setautorestart").checked,
    /* 空输入按默认 5 算，而不是 0：0 在运行时等于「不重启」，用户清空输入框
       多半是想用默认值，不该把功能悄悄关掉。显式填 0 仍然生效。 */
    restart_max: (() => {
      const raw = parseInt($("setrestartmax").value, 10);
      return Number.isFinite(raw) ? Math.max(0, Math.min(20, raw)) : 5;
    })(),
    openfrp: {
      token: $("settoken").value.trim(),
      proxy_id: parseInt($("setproxyid").value, 10) || 0,
      auto_start: $("setautostart").checked
    }
  };
  if (generic) {
    body.launch = {
      mode: $("setgmode").value,
      program: $("setgprogram").value.trim(),
      args: $("setgargs").value.trim().split(/\s+/).filter(Boolean),
      command: $("setgcommand").value.trim(),
      workdir: $("setgworkdir").value.trim()
    };
    if ($("setgmode").value === "exec" && !body.launch.program) {
      fail(new Error(strings["web.new.program"] || "program required"));
      return;
    }
    if ($("setgmode").value !== "exec" && !body.launch.command) {
      fail(new Error(strings["web.new.command"] || "command required"));
      return;
    }
  } else {
    body.mc_version = $("setmcver").value.trim();
    body.jar = $("setjar").value.trim() || "server.jar";
    body.min_mem = $("setminmem").value.trim() || "1G";
    body.max_mem = $("setmaxmem").value.trim() || "4G";
    body.extra_jvm_args = $("setjvm").value.trim().split(/\s+/).filter(Boolean);
    body.extra_server_args = $("setsrv").value.trim().split(/\s+/).filter(Boolean);
  }

  try {
    const data = await apiOk("/api/instances/settings", body);
    toast(data.message || strings["web.settings.saved"] || "");
    closeSettings();
    await refresh();
  } catch (err) {
    fail(err);
  }
}

/* ---------------------------------------------------------------- frp 面板 */

function frpToggleTypeFields() {
  const ptype = $("frptype").value;
  const needsPort = ptype === "tcp" || ptype === "udp";
  $("frp-remote-wrap").hidden = !needsPort;
  $("frp-domain-wrap").hidden = needsPort;
}

let frpManual = { url: "", asset: "", binName: "frpc" };

function renderFrpManual() {
  const hint = fmt(strings["web.frp.manual_hint"] || "{asset}",
                   { asset: frpManual.asset || "", bin: frpManual.binName || "" });
  $("frp-manual-hint").textContent = hint;
  $("frpreleases").disabled = !frpManual.url;
}

function renderFrp(data) {
  const status = data.status || {};
  const settings = data.settings || {};
  if (data.manual) {
    frpManual = data.manual;
    renderFrpManual();
  }
  const runText = status.running ? (strings["web.frp.running"] || "running")
                                 : (strings["web.frp.stopped"] || "stopped");
  const binText = status.binary ? (strings["web.frp.binary_ok"] || "ready")
                                : (strings["web.frp.binary_missing"] || "missing");
  $("frpstatus").textContent = (strings["web.frp.status"] || "Status") +
    ": " + runText + " · " + binText;
  $("frpstart").disabled = !!status.running;
  $("frpstop").disabled = !status.running;

  // 正在输入时不要用服务端值把输入框冲掉
  if (document.activeElement !== $("frpaddr")) $("frpaddr").value = settings.serverAddr || "";
  if (document.activeElement !== $("frpport")) $("frpport").value = String(settings.serverPort || 7000);
  if (document.activeElement !== $("frptoken")) $("frptoken").value = settings.token || "";

  const box = $("frpproxies");
  box.innerHTML = "";
  const proxies = data.proxies || [];
  if (!proxies.length) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = strings["web.frp.no_proxies"] || "";
    box.appendChild(empty);
    return;
  }
  const table = document.createElement("table");
  table.className = "flist";
  const head = document.createElement("thead");
  const hr = document.createElement("tr");
  [strings["web.frp.proxy_name"], strings["web.frp.proxy_type"],
   strings["web.frp.local_ip"], strings["web.frp.local_port"],
   strings["web.frp.remote_port"], ""].forEach((label) => {
    const th = document.createElement("th");
    th.textContent = label || "";
    hr.appendChild(th);
  });
  head.appendChild(hr);
  table.appendChild(head);
  const tbody = document.createElement("tbody");
  proxies.forEach((p) => {
    const tr = document.createElement("tr");
    const cells = [
      p.name, p.type, p.localIP, String(p.localPort || ""),
      p.remotePort ? String(p.remotePort) : (p.customDomains || []).join(", ")
    ];
    cells.forEach((text) => {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    });
    const opsTd = document.createElement("td");
    const ops = document.createElement("div");
    ops.className = "fops";
    ops.appendChild(opButton("✕", strings["web.frp.remove"],
      () => frpRemoveProxy(p.index, p.name)));
    opsTd.appendChild(ops);
    tr.appendChild(opsTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
}

async function loadFrp() {
  try {
    renderFrp(await apiOk("/api/frp"));
  } catch (err) {
    fail(err);
  }
}

function openFrp() {
  $("frpmodal").hidden = false;
  frpToggleTypeFields();
  loadFrp();
}

function closeFrp() {
  $("frpmodal").hidden = true;
}

function frpFormSettings() {
  // renderFrp() 会用传进来的 settings 覆盖这三个输入框。增量操作（起停、
  // 增删代理）以前传的是 {}，等于把用户刚填、还没点保存的服务器地址/端口/
  // token 静默清空——触发点击的按钮自己持有焦点，renderFrp 里那道
  // activeElement 守卫拦不住。所以这些调用改成把「输入框当前的值」当成
  // settings 传回去，写回去的还是原样。
  return {
    serverAddr: $("frpaddr").value.trim(),
    serverPort: parseInt($("frpport").value, 10) || 7000,
    token: $("frptoken").value.trim()
  };
}

async function frpSave() {
  try {
    const data = await apiOk("/api/frp/settings", frpFormSettings());
    toast(data.message || "");
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpStart() {
  try {
    const data = await apiOk("/api/frp/start", {});
    toast(data.message || "");
    renderFrp({ status: data.status, settings: frpFormSettings(), proxies: [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpStop() {
  try {
    const data = await apiOk("/api/frp/stop", {});
    toast(data.message || "");
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpDownload() {
  toast(strings["web.frp.downloading"] || "");
  try {
    const data = await apiOk("/api/frp/download", {});
    toast(data.message || "");
  } catch (err) {
    // 下载不通时告诉用户去哪手动拿，并把上传入口亮出来
    fail(err);
    renderFrpManual();
  }
  loadFrp();
}

async function frpUpload(file) {
  if (!file) return;
  const label = (strings["web.frp.uploading"] || "Uploading…") + " " + file.name;
  try {
    // 直接把 File 当请求体发；压缩包和裸二进制都收
    const data = await withProgress(label, (report) => uploadWithProgress(
      "/api/frp/upload", file, report));
    toast(data.message || "");
  } catch (err) {
    fail(err);
  }
  loadFrp();
}

async function frpAddProxy() {
  const ptype = $("frptype").value;
  const body = {
    name: $("frpname").value.trim(),
    type: ptype,
    localIP: $("frplocalip").value.trim() || "127.0.0.1",
    localPort: parseInt($("frplocalport").value, 10) || 0
  };
  if (ptype === "tcp" || ptype === "udp") {
    body.remotePort = parseInt($("frpremoteport").value, 10) || 0;
  } else {
    body.customDomains = $("frpdomains").value.trim();
  }
  try {
    const data = await apiOk("/api/frp/proxy", body);
    $("frpname").value = "";
    $("frplocalport").value = "";
    $("frpremoteport").value = "";
    $("frpdomains").value = "";
    renderFrp({ status: { running: !$("frpstop").disabled, binary: true },
                settings: frpFormSettings(), proxies: data.proxies || [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

async function frpRemoveProxy(index, name) {
  const ask = fmt(strings["web.frp.confirm_remove"] || "Remove {name}?", { name: name });
  if (!window.confirm(ask)) return;
  try {
    const data = await apiOk("/api/frp/proxy/delete", { index: index });
    renderFrp({ status: { running: !$("frpstop").disabled, binary: true },
                settings: frpFormSettings(), proxies: data.proxies || [] });
    loadFrp();
  } catch (err) {
    fail(err);
  }
}

/* ---------------------------------------------------------------- 主题 */
// 三档：跟系统 / 深 / 浅。写成循环而不是开关，是因为「跟随系统」也是一种
// 需要被记住的状态，不能当成什么都没选。
const THEME_MODES = ["auto", "dark", "light"];
const THEME_GLYPH = { auto: "◐", dark: "☾", light: "☀" };
const THEME_MQ = window.matchMedia("(prefers-color-scheme: dark)");

function themeMode() {
  try {
    const saved = localStorage.getItem("mstl.theme");
    return THEME_MODES.indexOf(saved) >= 0 ? saved : "auto";
  } catch (e) {
    return "auto";
  }
}

function applyTheme(mode) {
  const dark = mode === "dark" || (mode === "auto" && THEME_MQ.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("themebtn").textContent = THEME_GLYPH[mode] || THEME_GLYPH.auto;
  try { localStorage.setItem("mstl.theme", mode); } catch (e) {}
}

$("themebtn").onclick = () => {
  applyTheme(THEME_MODES[(THEME_MODES.indexOf(themeMode()) + 1) % THEME_MODES.length]);
};

// 系统在日落时换色时，处于「跟系统」的面板也要跟着走
const themeFollow = () => { if (themeMode() === "auto") applyTheme("auto"); };
if (THEME_MQ.addEventListener) THEME_MQ.addEventListener("change", themeFollow);
else if (THEME_MQ.addListener) THEME_MQ.addListener(themeFollow);

applyTheme(themeMode());

buildChips();

try {
  const saved = localStorage.getItem("mstl.selected");
  if (saved) selected = saved;
} catch (e) {}

refresh().then(connect).catch(() => {
  // 鉴权失败时别再连 SSE：EventSource 不带 token，服务端只会回那张 401 的
  // HTML 页，onmessage 永远不触发、readyState 停在 0，指示灯就永久卡在琥珀色
  // 的「连接中」。原因已经由 showAuthNotice() 摊在用户面前了。
  if (!authFailed) connect();
});
setInterval(() => {
  if (!authFailed) refresh().catch(() => {});
}, 15000);
