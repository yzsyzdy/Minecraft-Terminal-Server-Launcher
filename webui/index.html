<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSTL</title>
<style>
  :root{
    --bg:#11151c; --card:#1a2029; --line:#28313d; --fg:#e6ebf2; --dim:#8b98a9;
    --accent:#4c5bd4; --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px}
  header b{font-size:16px}
  header .sp{flex:1}
  main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 54px)}
  #list{border-right:1px solid var(--line);overflow:auto;padding:10px}
  .empty{color:var(--dim);padding:14px 6px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:8px;
        padding:10px;margin-bottom:8px;cursor:pointer}
  .item.sel{border-color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .name{font-weight:600}
  .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .badge{font-size:12px;padding:1px 8px;border-radius:99px;
         border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.running{color:var(--ok);border-color:var(--ok)}
  .badge.stopping{color:var(--warn);border-color:var(--warn)}
  button{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid var(--line);
         background:#222a35;color:var(--fg);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  #pane{display:flex;flex-direction:column;min-width:0}
  #head{padding:12px 16px;border-bottom:1px solid var(--line);
        display:flex;align-items:center;gap:10px}
  #log{flex:1;overflow:auto;margin:0;padding:12px 16px;white-space:pre-wrap;
       word-break:break-all;font:12.5px/1.6 ui-monospace,Consolas,monospace}
  #log .note{color:var(--dim)}
  #log .input{color:var(--accent)}
  #bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
  #cmd{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
       background:#0d1117;color:var(--fg);font:12.5px ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <b id="title">MSTL</b>
  <span class="meta" id="hint"></span>
  <span class="sp"></span>
  <button id="refresh">⟳</button>
</header>
<main>
  <div id="list"></div>
  <div id="pane">
    <div id="head">
      <span class="name" id="cur"></span>
      <span class="badge" id="curstate"></span>
    </div>
    <pre id="log"></pre>
    <div id="bar">
      <input id="cmd" spellcheck="false" autocomplete="off">
      <button class="primary" id="send"></button>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let strings = {};
let instances = [];
let selected = null;
let stream = null;

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

async function api(path, body) {
  const options = { method: body ? "POST" : "GET", headers: {} };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  if (res.status === 401) {
    document.body.innerHTML =
      '<div style="padding:28px"><h3>' + esc(strings["web.auth.invalid"] || "401") +
      '</h3><p style="color:#8b98a9">' + esc(strings["web.auth.help"] || "") + '</p></div>';
    throw new Error("unauthorized");
  }
  return res.json();
}

function applyStrings() {
  $("title").textContent = strings["web.panel.title"] || "MSTL";
  $("send").textContent = strings["web.panel.send"] || "Send";
  $("cmd").placeholder = strings["web.panel.command"] || "";
}

async function refresh() {
  const data = await api("/api/state");
  if (data.strings) strings = data.strings;
  instances = data.instances || [];
  applyStrings();
  render();
}

function stateLabel(state) {
  return strings["web.state." + state] || state;
}

function render() {
  const box = $("list");
  box.innerHTML = "";
  if (!instances.length) {
    box.innerHTML = '<div class="empty">' + esc(strings["web.panel.no_instances"] || "") + "</div>";
  }
  instances.forEach(item => {
    const state = item.state || "stopped";
    const el = document.createElement("div");
    el.className = "item" + (item.name === selected ? " sel" : "");
    el.innerHTML =
      '<div class="row"><span class="name">' + esc(item.name) + "</span>" +
      '<span class="badge ' + esc(state) + '">' + esc(stateLabel(state)) + "</span></div>" +
      '<div class="meta">' + esc(item.mc_version || "?") + " · " + esc(item.jar || "?") + "</div>" +
      '<div class="row" style="margin-top:8px">' +
      '<button data-act="start"' + (state !== "stopped" ? " disabled" : "") + ">" +
      esc(strings["web.panel.start"] || "Start") + "</button>" +
      '<button data-act="stop"' + (state !== "running" ? " disabled" : "") + ">" +
      esc(strings["web.panel.stop"] || "Stop") + "</button></div>";

    el.onclick = (ev) => {
      const act = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-act");
      if (act === "start") {
        api("/api/start", { name: item.name }).then(refresh).catch(() => {});
      } else if (act === "stop") {
        api("/api/stop", { name: item.name }).then(refresh).catch(() => {});
      } else {
        select(item.name);
      }
    };
    box.appendChild(el);
  });

  const cur = instances.find(x => x.name === selected);
  $("cur").textContent = cur ? cur.name : "";
  const st = cur ? (cur.state || "stopped") : "";
  $("curstate").textContent = cur ? stateLabel(st) : "";
  $("curstate").className = "badge " + st;
}

function writeLine(cls, text) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function select(name) {
  selected = name;
  $("log").innerHTML = "";
  if (stream) { stream.close(); stream = null; }
  render();
  if (!name) return;
  stream = new EventSource("/api/stream?name=" + encodeURIComponent(name));
  stream.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    if (event.type === "line") {
      if (event.kind === "note") writeLine("note", event.text || "");
      else if (event.kind === "input") writeLine("input", "> " + (event.text || ""));
      else writeLine("", event.text || "");
    } else if (event.type === "state") {
      const it = instances.find(x => x.name === event.instance);
      if (it) { it.state = event.state; it.exit_code = event.exit_code; }
      render();
    }
  };
  stream.onerror = () => {};
}

function sendCommand() {
  const value = $("cmd").value.trim();
  if (!value || !selected) return;
  $("cmd").value = "";
  api("/api/command", { name: selected, command: value }).then(refresh).catch(() => {});
}

$("send").onclick = sendCommand;
$("refresh").onclick = () => refresh().catch(() => {});
$("cmd").addEventListener("keydown", (ev) => { if (ev.key === "Enter") sendCommand(); });

refresh().catch(() => {});
setInterval(() => { if (!stream) refresh().catch(() => {}); }, 5000);
</script>
</body>
</html>
