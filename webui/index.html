<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSTL</title>
<style>
  :root{
    color-scheme:light;
    --bg:#ffffff; --card:#ffffff; --console:#f6f8fa; --line:#e4e7ec;
    --fg:#1f2430; --dim:#6b7480; --hover:#f2f4f7; --sel:#f5f6fe;
    --accent:#4c5bd4; --accent-2:#6b78e6; --accent-3:#3f4cc4;
    --tint:#f7f8ff; --tint-2:#eef0fd;
    --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--fg);
       background-color:#ffffff;
       background-image:linear-gradient(180deg,var(--tint) 0,#ffffff 260px);
       background-repeat:no-repeat;
       background-attachment:fixed;
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
  header{position:relative;padding:14px 18px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#ffffff,#fbfcff);
         display:flex;align-items:center;gap:12px}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
                opacity:.55;pointer-events:none;
                background:linear-gradient(90deg,var(--accent) 0,var(--accent-2) 32%,
                           rgba(76,91,212,0) 100%)}
  header b{font-size:16px}
  header .sp{flex:1}

  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;
        background:var(--dim);transition:background .2s,box-shadow .2s}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(26,127,55,.14)}
  .dot.connecting{background:var(--warn);box-shadow:0 0 0 3px rgba(154,103,0,.14)}
  .dot.offline{background:var(--err);box-shadow:0 0 0 3px rgba(207,34,46,.14)}

  main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 54px)}
  #list{border-right:1px solid var(--line);overflow:auto;padding:10px}
  .empty{color:var(--dim);padding:14px 6px}
  .item{background:linear-gradient(180deg,#ffffff,#fdfdff);
        border:1px solid var(--line);border-radius:8px;
        padding:10px;margin-bottom:8px;cursor:pointer;
        transition:background .12s,border-color .12s,box-shadow .12s}
  .item:hover{background:linear-gradient(180deg,#fbfcff,var(--hover))}
  .item.sel{border-color:var(--accent);
            background:linear-gradient(135deg,var(--tint-2),var(--tint));
            box-shadow:0 0 0 3px rgba(76,91,212,.08)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .name{font-weight:600}
  .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .badge{font-size:12px;padding:1px 8px;border-radius:99px;
         border:1px solid var(--line);color:var(--dim);white-space:nowrap;
         background:linear-gradient(180deg,#ffffff,#f7f8fa)}
  .badge.running{color:var(--ok);border-color:#9fd3ae;
                 background:linear-gradient(180deg,#f2fbf5,#e7f6ec)}
  .badge.stopping{color:var(--warn);border-color:#e6cf94;
                  background:linear-gradient(180deg,#fffaf0,#fdf3dd)}

  button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid var(--line);
         background:#ffffff;color:var(--fg);cursor:pointer;
         transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--hover);border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent) 55%,var(--accent-3));
                 border-color:var(--accent);color:#ffffff;
                 box-shadow:0 1px 2px rgba(76,91,212,.22)}
  button.primary:hover:not(:disabled){background:linear-gradient(135deg,#7b86ee,#4c5bd4 55%,#37429f);
                 border-color:var(--accent-3);color:#ffffff}
  button:disabled{opacity:.45;cursor:default}
  button.on{border-color:var(--accent);color:var(--accent);background:var(--sel)}

  #pane{position:relative;display:flex;flex-direction:column;min-width:0}
  #head{padding:12px 16px;border-bottom:1px solid var(--line);
        background:linear-gradient(180deg,#ffffff,#fbfcff);
        display:flex;align-items:center;gap:10px}
  #head .sp{flex:1}

  #details{display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px;
           border-bottom:1px solid var(--line);background:#ffffff}
  #details:empty{display:none}
  .chip{font-size:12px;max-width:52ch;padding:2px 9px;border-radius:6px;
        color:var(--dim);border:1px solid var(--line);
        background:linear-gradient(180deg,#ffffff,#fbfcff);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip b{color:var(--fg);font-weight:600}

  #log{flex:1;overflow:auto;margin:0;padding:12px 16px;white-space:pre-wrap;
       word-break:break-all;color:#24292f;
       background:linear-gradient(180deg,#f8fafc,#f3f5f9 55%,#f6f8fa);
       font:12.5px/1.6 ui-monospace,Consolas,monospace}
  #log .note{color:var(--dim)}
  #log .input{color:var(--accent);font-weight:600}
  #log .warn{color:var(--warn)}
  #log .error{color:var(--err)}

  #jump{position:absolute;right:22px;bottom:112px;border-radius:99px;
        box-shadow:0 3px 10px rgba(31,36,48,.14);font-size:12px;padding:4px 12px}

  #bar{display:flex;flex-direction:column;gap:8px;padding:10px 16px;
       border-top:1px solid var(--line);
       background:linear-gradient(180deg,#ffffff,#fbfcff)}
  #chips{display:flex;flex-wrap:wrap;gap:6px}
  #chips button{font-size:12px;padding:3px 10px;border-radius:99px;color:var(--dim)}
  #line{display:flex;gap:8px}
  #cmd{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
       background:#ffffff;color:var(--fg);font:12.5px ui-monospace,Consolas,monospace}
  #cmd::placeholder{color:var(--dim)}
  #cmd:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,91,212,.12)}

  @media (max-width:780px){
    main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    #list{border-right:none;border-bottom:1px solid var(--line);max-height:34vh}
    #jump{bottom:132px}
  }
</style>
</head>
<body>
<header>
  <b id="title">MSTL</b>
  <span class="dot" id="conn"></span>
  <span class="sp"></span>
  <button id="refresh">⟳</button>
</header>
<main>
  <div id="list"></div>
  <div id="pane">
    <div id="head">
      <span class="name" id="cur"></span>
      <span class="badge" id="curstate"></span>
      <span class="sp"></span>
      <button id="clear"></button>
      <button id="follow"></button>
    </div>
    <div id="details"></div>
    <pre id="log"></pre>
    <button id="jump" hidden></button>
    <div id="bar">
      <div id="chips"></div>
      <div id="line">
        <input id="cmd" spellcheck="false" autocomplete="off">
        <button class="primary" id="send"></button>
      </div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const MAX_LINES = 2000;
const QUICK = [
  { text: "list" },
  { text: "save-all" },
  { text: "help" },
  { text: "say ", prefill: true }
];

let strings = {};
let instances = [];
let selected = null;
let stream = null;
let follow = true;
let lastAtBottom = true;

// 按实例缓存控制台输出。服务端只在 SSE 建连时重放一次历史，而连接建立时
// 用户往往还没选中任何实例——原来这些行会因为 instance !== selected 被直接
// 丢掉，之后选中实例只看到一片空白，要等下一行新输出才「活」过来。
let buffers = {};
// 每个实例已画到的事件序号，用于过滤断线重连后的历史重放
let lastSeq = {};

function fmt(tpl, values) {
  return String(tpl == null ? "" : tpl).replace(/\{(\w+)\}/g, (m, k) =>
    Object.prototype.hasOwnProperty.call(values, k) ? values[k] : m);
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function baseName(path) {
  return String(path || "").split(/[\\/]/).pop();
}

async function api(path, body) {
  const options = { method: body ? "POST" : "GET", headers: {} };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  if (res.status === 401) {
    document.body.innerHTML =
      '<div style="padding:28px"><h3>' + esc(strings["web.auth.invalid"] || "401") +
      '</h3><p style="color:#6b7480">' + esc(strings["web.auth.help"] || "") + "</p></div>";
    throw new Error("unauthorized");
  }
  return res.json();
}

/* ---------------------------------------------------------------- 连接状态 */

function setConn(state) {
  const dot = $("conn");
  dot.className = "dot " + state;
  dot.title = strings["web.conn." + (state === "online" ? "online"
    : state === "connecting" ? "connecting" : "offline")] || state;
}

function connect() {
  if (stream) stream.close();
  setConn("connecting");
  // 不带 name：一条流同时盯住所有实例
  stream = new EventSource("/api/stream");
  stream.onopen = () => setConn("online");
  stream.onerror = () => {
    // EventSource 会自己重连：只有它彻底放弃了，才值得显示成断开
    setConn(stream && stream.readyState === 2 ? "offline" : "connecting");
  };
  stream.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch (e) { return; }
    setConn("online");
    handle(event);
  };
}

function alreadySeen(event) {
  // 每条事件都带实例内单调递增的 seq。EventSource 断线重连时服务端会把
  // 历史整段重放一遍，靠它把画过的行筛掉，否则日志里会出现成片重复。
  const name = event.instance;
  const seq = typeof event.seq === "number" ? event.seq : null;
  if (seq === null) return false;
  if (lastSeq[name] !== undefined && seq <= lastSeq[name]) return true;
  lastSeq[name] = seq;
  return false;
}

function bufferLine(event) {
  if (event.type !== "line") return null;
  const cls = event.kind === "note" ? "note"
            : event.kind === "input" ? "input"
            : lineClass(event.text);
  const text = event.kind === "input" ? "> " + (event.text || "") : (event.text || "");
  const name = event.instance;
  const buf = buffers[name] || (buffers[name] = []);
  const entry = { cls, text };
  buf.push(entry);
  if (buf.length > MAX_LINES) buf.splice(0, buf.length - MAX_LINES);
  return entry;
}

function handle(event) {
  if (alreadySeen(event)) return;
  if (event.type === "state") {
    const item = instances.find(x => x.name === event.instance);
    if (item) {
      item.state = event.state;
      item.exit_code = event.exit_code;
      item.pid = event.pid;
    }
    render();
    renderDetails();
    return;
  }
  const entry = bufferLine(event);
  if (entry && event.instance === selected) appendLine(entry.cls, entry.text);
}

/* ---------------------------------------------------------------- 实例列表 */

async function refresh() {
  const data = await api("/api/state");
  if (data.strings) strings = data.strings;
  instances = data.instances || [];
  if (selected && !instances.some(x => x.name === selected)) selected = null;
  applyStrings();
  render();
  renderDetails();
}

function applyStrings() {
  $("title").textContent = strings["web.panel.title"] || "MSTL";
  $("send").textContent = strings["web.panel.send"] || "Send";
  $("cmd").placeholder = strings["web.panel.command"] || "";
  $("clear").textContent = strings["web.panel.clear"] || "Clear";
  $("follow").textContent = strings["web.panel.follow"] || "Follow";
  $("jump").textContent = strings["web.panel.jump_bottom"] || "Bottom";
  $("refresh").title = strings["web.panel.instances"] || "";
  $("follow").className = follow ? "on" : "";
}

function stateLabel(state) {
  return strings["web.state." + state] || state;
}

function render() {
  const box = $("list");
  box.innerHTML = "";
  if (!instances.length) {
    box.innerHTML = '<div class="empty">' + esc(strings["web.panel.no_instances"] || "") + "</div>";
  }
  instances.forEach(item => {
    const state = item.state || "stopped";
    const el = document.createElement("div");
    el.className = "item" + (item.name === selected ? " sel" : "");
    el.innerHTML =
      '<div class="row"><span class="name">' + esc(item.name) + "</span>" +
      '<span class="badge ' + esc(state) + '">' + esc(stateLabel(state)) + "</span></div>" +
      '<div class="meta">' + esc(item.mc_version || "?") + " · " + esc(item.jar || "?") + "</div>" +
      '<div class="row" style="margin-top:8px">' +
      '<button data-act="start"' + (state !== "stopped" ? " disabled" : "") + ">" +
      esc(strings["web.panel.start"] || "Start") + "</button>" +
      '<button data-act="stop"' + (state !== "running" ? " disabled" : "") + ">" +
      esc(strings["web.panel.stop"] || "Stop") + "</button></div>";

    el.onclick = (ev) => {
      const act = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-act");
      if (act === "start") {
        // 顺便把它选上，否则点了启动却在右边控制台里看不到任何反应
        select(item.name);
        api("/api/start", { name: item.name }).then(refresh).catch(() => {});
      } else if (act === "stop") {
        api("/api/stop", { name: item.name }).then(refresh).catch(() => {});
      } else {
        select(item.name);
      }
    };
    box.appendChild(el);
  });

  const cur = instances.find(x => x.name === selected);
  const st = cur ? (cur.state || "stopped") : "";
  $("cur").textContent = cur ? cur.name : "";
  $("curstate").textContent = cur ? stateLabel(st) : "";
  $("curstate").className = "badge " + st;
}

/* ---------------------------------------------------------------- 详情条 */

function renderDetails() {
  const box = $("details");
  const item = instances.find(x => x.name === selected);
  box.innerHTML = "";
  if (!item) return;

  const chips = [];
  if (item.min_mem || item.max_mem) {
    chips.push({ text: fmt(strings["web.detail.memory"], { min: item.min_mem || "?", max: item.max_mem || "?" }) });
  }
  if (item.state === "running" && item.pid) {
    chips.push({ text: fmt(strings["web.detail.pid"], { pid: item.pid }) });
  } else if (item.exit_code !== null && item.exit_code !== undefined) {
    chips.push({ text: fmt(strings["web.detail.exit_code"], { code: item.exit_code }) });
  }
  if (item.java) {
    chips.push({ text: "Java " + baseName(item.java), title: item.java });
  }
  if (item.workdir) {
    chips.push({ text: fmt(strings["web.detail.workdir"], { path: item.workdir }), title: item.workdir });
  }
  if (item.command && item.command.length) {
    chips.push({ text: (strings["web.detail.command"] || "command") + ": " + item.command.join(" "),
                 title: item.command.join(" ") });
  }

  chips.forEach(c => {
    const el = document.createElement("span");
    el.className = "chip";
    el.textContent = c.text;
    if (c.title) el.title = c.title;
    box.appendChild(el);
  });
}

/* ---------------------------------------------------------------- 控制台 */

function lineClass(text) {
  if (/\b(ERROR|SEVERE|FATAL)\b/.test(text) || /Exception|\bat [\w.$]+\([\w.]+\.java:\d+\)/.test(text)) {
    return "error";
  }
  if (/\bWARN(ING)?\b/.test(text)) return "warn";
  return "";
}

function appendLine(cls, text) {
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = text;
  const log = $("log");
  log.appendChild(el);
  while (log.childElementCount > MAX_LINES) log.removeChild(log.firstChild);
  if (follow) log.scrollTop = log.scrollHeight;
}

function renderLog() {
  const log = $("log");
  const entries = buffers[selected] || [];
  const frag = document.createDocumentFragment();
  entries.forEach(entry => {
    const el = document.createElement("div");
    if (entry.cls) el.className = entry.cls;
    el.textContent = entry.text;
    frag.appendChild(el);
  });
  log.innerHTML = "";
  log.appendChild(frag);
  log.scrollTop = log.scrollHeight;
  $("jump").hidden = true;
}

function clearLog() {
  buffers[selected] = [];
  $("log").innerHTML = "";
  $("jump").hidden = true;
  lastAtBottom = true;
}

function setFollow(value) {
  follow = value;
  applyStrings();
  if (follow) {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
    $("jump").hidden = true;
  }
}

$("log").addEventListener("scroll", () => {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
  lastAtBottom = atBottom;
  if (!atBottom && follow) {
    follow = false;
    applyStrings();
  }
  $("jump").hidden = atBottom;
  if (atBottom && !follow) {
    // 用户自己滚到底了，把跟随接回来
    follow = true;
    applyStrings();
  }
});

/* ---------------------------------------------------------------- 选择 */

function select(name) {
  selected = name;
  try { localStorage.setItem("mstl.selected", name || ""); } catch (e) {}
  // 历史行一直存在本地缓冲里，这里直接整段画出来，不必重连那条全局流
  renderLog();
  render();
  renderDetails();
}

/* ---------------------------------------------------------------- 指令 */

function sendCommand(text) {
  const value = (text == null ? $("cmd").value : text).trim();
  if (!value || !selected) return;
  $("cmd").value = "";
  api("/api/command", { name: selected, command: value }).then(refresh).catch(() => {});
}

function buildChips() {
  const box = $("chips");
  box.innerHTML = "";
  QUICK.forEach(q => {
    const el = document.createElement("button");
    el.textContent = q.text.trim();
    el.onclick = () => {
      if (q.prefill) {
        $("cmd").value = q.text;
        $("cmd").focus();
      } else {
        sendCommand(q.text);
      }
    };
    box.appendChild(el);
  });
}

/* ---------------------------------------------------------------- 绑定 */

$("send").onclick = () => sendCommand(null);
$("cmd").addEventListener("keydown", (ev) => { if (ev.key === "Enter") sendCommand(null); });
$("refresh").onclick = () => refresh().catch(() => {});
$("clear").onclick = clearLog;
$("follow").onclick = () => setFollow(!follow);
$("jump").onclick = () => setFollow(true);

buildChips();

try {
  const saved = localStorage.getItem("mstl.selected");
  if (saved) selected = saved;
} catch (e) {}

refresh().then(connect).catch(() => { connect(); });
setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
</html>
